<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>911 GT3 RS</title>
<meta name="description" content="An interactive showcase.">
<link rel="icon" href="../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f2f2f0;
    --dim:rgba(242,242,240,.55);
    --hair:rgba(242,242,240,.18);
    --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --ease:cubic-bezier(.22,.61,.36,1);
    /* Act 3 scroll distance. Tuned per input class at runtime. */
    --scrub-vh:600;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#000;color:var(--ink)}
  body{
    font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;      /* kill pull-to-refresh mid-scrub */
    text-rendering:optimizeLegibility;
  }
  body.locked{overflow:hidden;height:100%}
  .portfolio-home{position:fixed;z-index:50;top:18px;left:18px;color:#fff;font:600 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;padding:10px 12px;border:1px solid rgba(255,255,255,.7);background:rgba(0,0,0,.36);transition:background .2s,color .2s}
  .portfolio-home:hover{background:#fff;color:#000}

  /* ---------- stage ---------- */
  /* 100lvh, not dvh: immune to iOS Safari's address-bar resize, which
     otherwise retriggers layout mid-scrub. Same lesson as the main site. */
  .stage{
    position:fixed; inset:0;
    height:100lvh;
    overflow:hidden;
    background:#000;
    z-index:1;
  }
  .stage video{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    min-width:100%; min-height:100%;
    width:auto; height:auto;
    object-fit:cover;
    opacity:0;
    transition:opacity .45s linear;
    will-change:opacity;
  }
  .stage video.on{opacity:1}

  /* Mobile portrait: 16:9 letterboxed on a phone makes the car tiny.
     Cover-crop instead and bias toward frame centre where the car sits. */
  @media (max-aspect-ratio:1/1){
    .stage video{
      width:100%; height:100%;
      object-fit:cover; object-position:58% center;
    }
  }

  /* ---------- overlay: the connective tissue ---------- */
  /* One layer above all three acts. Because it never changes across act
     boundaries, it does the work of hiding that they are separate files. */
  /* Water composites NORMALLY, not screen. A screen-blended layer can only
     ever add light, which makes the dark meniscus rim that identifies every
     real droplet impossible to draw — the drop can never be darker than what
     is behind it, so it reads as a sticker. Drops now paint their own
     darkness, which means they must be allowed to darken. */
  #fx{
    position:fixed; inset:0;
    z-index:5; pointer-events:none;
  }
  /* Grain keeps its own layer precisely because it still wants screen: it is
     additive luminance noise, and on the water layer it would wash the frame
     toward grey instead of sparkling. */
  #fxg{
    position:fixed; inset:0;
    z-index:6; pointer-events:none;
    mix-blend-mode:screen;
    opacity:.85;
  }
  .vignette{
    position:fixed; inset:0; z-index:7; pointer-events:none;
    background:
      radial-gradient(120% 85% at 50% 45%,transparent 42%,rgba(0,0,0,.55) 100%),
      linear-gradient(to bottom,rgba(0,0,0,.35),transparent 22%,transparent 78%,rgba(0,0,0,.45));
  }

  /* ---------- UI ---------- */
  .ui{position:fixed;z-index:10}

  .hint{
    left:50%; bottom:clamp(28px,7vh,64px);
    transform:translateX(-50%);
    /* The prompt is visual only: tapping it must reach the stage launch
       handler underneath instead of swallowing the user's first click. */
    pointer-events:none;
    text-align:center;
    font-size:44px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--dim);
    transition:opacity .5s var(--ease);
  }
  .hint .k{
    display:block; margin-top:10px;
    font-size:10px; letter-spacing:.2em; color:rgba(242,242,240,.35);
  }
  .pulse{animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

  .title{
    left:clamp(18px,4vw,44px); top:clamp(18px,4vh,40px);
    font-size:11px; letter-spacing:.3em; text-transform:uppercase;
    line-height:1.9; color:var(--dim);
    transition:opacity .6s var(--ease);
  }
  .title b{display:block;color:var(--ink);font-weight:500;letter-spacing:.22em}

  .back{
    right:clamp(18px,4vw,44px); top:clamp(18px,4vh,40px);
    font-size:10px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--dim); text-decoration:none;
    padding:8px 2px; pointer-events:auto;
    transition:color .3s;
  }
  .back:hover{color:var(--ink)}

  /* ---------- stats ---------- */
  .stat{
    position:fixed; z-index:9; pointer-events:none;
    max-width:min(78vw,340px);
    opacity:0;
    transform:translateY(10px);
    transition:opacity .5s var(--ease),transform .7s var(--ease);
    will-change:opacity,transform;
  }
  .stat.show{opacity:1;transform:none}
  /* Clip 2 fills the frame with bright bodywork, so there is no reliable
     dark negative space left to drop captions into. A soft local scrim
     guarantees contrast without reading as a panel or box. */
  .stat::before{
    content:''; position:absolute; z-index:-1;
    left:-46px; right:-46px; top:-40px; bottom:-40px;
    background:radial-gradient(ellipse at center,
      rgba(0,0,0,.66) 0%, rgba(0,0,0,.46) 42%, rgba(0,0,0,0) 76%);
  }
  /* Act 3's footage fills frame in places, so captions cannot rely on
     landing over empty road. A soft shadow keeps them legible over
     bodywork without introducing a visible plate or box. */
  .stat .lab,.stat .val,.stat .unit{
    text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 22px rgba(0,0,0,.7);
  }
  .stat .lab{
    display:block;
    font-size:10px; letter-spacing:.3em; text-transform:uppercase;
    color:var(--dim); margin-bottom:10px;
  }
  .stat .val{
    display:block;
    font-size:clamp(26px,5.2vw,52px);
    letter-spacing:-.02em; line-height:1; color:var(--ink);
    font-weight:400;
    white-space:nowrap;
  }
  .stat .val small{font-size:.42em;letter-spacing:.06em;margin-left:.5em;color:var(--dim)}
  /* Long units get their own line rather than wrapping mid-value. */
  .stat .unit{
    display:block; margin-top:9px;
    font-size:11px; letter-spacing:.18em;
    color:rgba(242,242,240,.78);
    white-space:nowrap;
  }
  .stat .rule{display:block;width:34px;height:1px;background:var(--hair);margin-top:16px}

  /* Per-beat placement. Kept clear of frame centre-right where the car sits. */
  .p-tl{left:clamp(18px,6vw,88px); top:24vh}
  .p-bl{left:clamp(18px,6vw,88px); bottom:22vh}
  .p-tr{right:clamp(18px,6vw,88px); top:22vh; text-align:right}
  .p-br{right:clamp(18px,6vw,88px); bottom:24vh; text-align:right}
  .p-tr .rule,.p-br .rule{margin-left:auto}
  @media (max-aspect-ratio:1/1){
    .p-tl,.p-bl{left:clamp(16px,6vw,40px)}
    .p-tr,.p-br{right:clamp(16px,6vw,40px)}
    .p-tl,.p-tr{top:16vh}
    .p-bl,.p-br{bottom:18vh}
  }

  /* ---------- Act 3 entry cue ---------- */
  /* The one moment the piece needs to tell you something, so it says it
     once, in the middle, and gets out of the way the instant you act on it. */
  .cue{
    position:fixed; left:50%; top:50%;
    transform:translate(-50%,-50%) scale(.96);
    z-index:11; pointer-events:none;
    text-align:center; white-space:nowrap;
    font-size:clamp(20px,4.6vw,50px);
    letter-spacing:.26em; text-transform:uppercase;
    color:#fff; font-weight:400;
    text-shadow:0 2px 24px rgba(0,0,0,.92), 0 0 70px rgba(0,0,0,.75);
    opacity:0;
    transition:opacity .45s var(--ease), transform .8s var(--ease);
  }
  .cue.on{
    opacity:1; transform:translate(-50%,-50%) scale(1);
    animation:blip 2.2s ease-in-out .55s infinite;
  }
  /* Dismisses upward — the same direction the content is about to travel. */
  .cue.off{
    opacity:0 !important;
    transform:translate(-50%,-72%) scale(.98);
    animation:none !important;
  }
  @keyframes blip{
    0%,100%{opacity:.5}
    50%{opacity:1}
  }

  /* ---------- progress ---------- */
  .prog{
    position:fixed; left:0; right:0; bottom:0; height:1px;
    background:var(--hair); z-index:10;
    opacity:0; transition:opacity .5s;
  }
  .prog.on{opacity:1}
  .prog i{display:block;height:100%;width:0;background:var(--ink);transform-origin:left}

  /* ---------- scroll driver ---------- */
  /* Act 3's scroll runway. Real document height is what gives us native
     inertia, keyboard keys, scrollbar drag and trackpad momentum for free. */
  #runway{height:1px}
  #runway.live{height:calc(var(--scrub-vh) * 1vh)}

  /* A running CSS animation beats `opacity:0 !important`, so the pulse has
     to be killed too or the launch hint never actually leaves. */
  .hidden{opacity:0 !important;pointer-events:none;animation:none !important}

  /* Arrives opaque and lifts on load, so the black the card faded into and
     the black this page starts on are the same black. Sits above the video
     but below the UI, so the chrome fades up with the picture. */
  #veil{
    position:fixed; inset:0; background:#000; z-index:7;
    pointer-events:none; opacity:1;
    transition:opacity .9s cubic-bezier(.4,0,.2,1);
  }
  #veil.lift{opacity:0}

  @media (prefers-reduced-motion:reduce){
    .pulse{animation:none}
    .stat{transition:opacity .2s linear;transform:none}
  }
</style>
</head>
<body class="locked">
  <a class="portfolio-home" href="/index.html?view=home&build=f818b9b">Home</a>

<div class="stage" id="stage">
  <!-- WebM first, now carrying AV1 rather than VP9: it measures higher
       fidelity than the VP9 encode it replaces while being ~19% smaller,
       which bought enough headroom to also run a mild sharpen pass. Chrome,
       Edge, Firefox and Safari 17+ take it; anything older falls through to
       the H.264 MP4.

       The explicit codec string is load-bearing, not decoration. A plain
       `video/webm` returns "maybe" from canPlayType on a browser that has
       WebM but no AV1 decoder, so it would accept the source and then fail
       to decode rather than falling through to the MP4. With the codec
       spelled out it returns empty and the fallback works. -->
  <video id="vLoop" muted loop playsinline preload="auto" poster="assets/hero-frame.png">
    <source src="assets/hero-loop.webm" type='video/webm; codecs="av01.0.08M.08"'>
    <source src="assets/hero-loop.mp4"  type="video/mp4">
  </video>
  <video id="vLaunch" muted playsinline preload="auto">
    <source src="assets/act2-launch.webm" type='video/webm; codecs="av01.0.08M.08"'>
    <source src="assets/act2-launch.mp4"  type="video/mp4">
  </video>
  <video id="vDrive" muted playsinline preload="auto">
    <source src="assets/act3-drive.webm" type='video/webm; codecs="av01.0.08M.08"'>
    <source src="assets/act3-drive.mp4"  type="video/mp4">
  </video>
</div>

<canvas id="fx"></canvas>
<canvas id="fxg"></canvas>
<div class="vignette"></div>
<div id="veil"></div>

<a class="ui back" href="/index.html?view=home&build=f818b9b">← 911 GT3 RS</a>

<div class="ui hint pulse" id="hint">
  Click to launch
</div>

<div class="cue" id="cue">Scroll to explore</div>

<div class="prog" id="prog"><i id="progBar"></i></div>

<div id="stats"></div>

<div id="runway"></div>

<script>
(function(){
  "use strict";

  var stage   = document.getElementById('stage');
  var vLoop   = document.getElementById('vLoop');
  var vLaunch = document.getElementById('vLaunch');
  var vDrive  = document.getElementById('vDrive');
  var hint    = document.getElementById('hint');
  var title   = document.getElementById('title');
  var subtitle= document.getElementById('subtitle');
  var runway  = document.getElementById('runway');
  var prog    = document.getElementById('prog');
  var progBar = document.getElementById('progBar');
  var cue     = document.getElementById('cue');
  var statsEl = document.getElementById('stats');
  // The old corner subtitle was deliberately removed from the visual design.
  // Keep the legacy launch code safe when it tries to update that absent node.
  function setSubtitle(text){ if (subtitle) subtitle.textContent = text; }

  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ============================================================
     STATS — six facts across five camera beats.
     Beat 3 (side profile) carries two, since beat 6 was dropped.
     `at` / `to` are normalised positions along the Act 3 track.
     ============================================================ */
  /* `suf` sits inline with the number; `unit` drops to its own line so a
     long string never wraps through the middle of the value. */
  var STATS = [
    {lab:'0–60 mph',    val:'2.9',       suf:'sec', at:.030, to:.155, pos:'p-bl'},
    {lab:'Top speed',   val:'184',       suf:'mph', at:.175, to:.300, pos:'p-tl'},
    {lab:'Horsepower',  val:'518',       suf:'hp',  at:.320, to:.440, pos:'p-bl'},
    {lab:'Weight, dry', val:'3,268',     suf:'lbs', at:.455, to:.575, pos:'p-tl'},
    {lab:'Engine',      val:'4.0',       suf:'L',   unit:'Flat-six · 9,000 rpm', at:.595, to:.735, pos:'p-tr'},
    {lab:'Nürburgring', val:'6:49.328',  suf:'',    at:.755, to:1.01,  pos:'p-tr'}
  ];

  STATS.forEach(function(s){
    var el = document.createElement('div');
    el.className = 'stat ' + s.pos;
    el.innerHTML =
      '<span class="lab">' + s.lab + '</span>' +
      '<span class="val">' + s.val + (s.suf ? '<small>' + s.suf + '</small>' : '') + '</span>' +
      (s.unit ? '<span class="unit">' + s.unit + '</span>' : '') +
      '<span class="rule"></span>';
    statsEl.appendChild(el);
    s.el = el;
    s.on = false;
  });

  /* ============================================================
     INPUT PROFILE
     A mouse wheel emits coarse discrete deltas; a trackpad emits fine
     continuous ones. Rather than guess, we measure the first real wheel
     event and size the scroll runway so that ONE NOTCH ADVANCES EXACTLY
     ONE FRAME. That is what makes wheel scrubbing feel like stepping
     through film instead of jumping between positions.
     ============================================================ */
  var isTouch = matchMedia('(hover:none)').matches || ('ontouchstart' in window);

  var FPS = 24;                 /* all three acts are encoded at 24fps */
  var frameCount = 0;
  var wheelPx = 100;            /* measured from the first wheel event */
  var isWheel = false;
  var wheelSeen = false;

  /* Frames advanced per wheel notch. One frame per notch was precise but
     meant ~387 notches to cross Act 3 — accurate and exhausting. Sixteen cuts
     that to ~24. The mapping being coarse does not cost smoothness, because
     that comes from the frame-quantised seek below plus the momentum glide
     spreading each notch over seconds rather than jumping it. */
  var FRAMES_PER_NOTCH = 16;

  function sizeRunway(){
    if (!frameCount) return;
    if (isWheel){
      runway.style.height =
        Math.round(frameCount / FRAMES_PER_NOTCH * wheelPx + window.innerHeight) + 'px';
    } else {
      runway.style.height = '';                       /* fall back to CSS */
      document.documentElement.style.setProperty('--scrub-vh', isTouch ? '520' : '760');
    }
    if (state === 'drive'){ target = scrollProgress(); kick(); }
  }

  /* Dismiss on the input itself, not just the resulting scroll — a finger
     already dragging shouldn't still be reading an instruction. */
  ['wheel','touchmove','keydown'].forEach(function(evt){
    window.addEventListener(evt, function(){
      if (state === 'drive') dismissCue();
    }, {passive:true});
  });

  window.addEventListener('wheel', function(e){
    if (wheelSeen) return;
    var d = Math.abs(e.deltaY);
    if (e.deltaMode === 1) d *= 16;        /* Firefox reports lines, not px */
    else if (e.deltaMode === 2) d *= window.innerHeight;
    if (d === 0) return;
    wheelSeen = true;
    /* A wheel notch is a large, whole-number delta. Trackpads emit small
       fractional ones and should keep the shorter, gesture-friendly runway. */
    if (d >= 40 && Math.abs(d - Math.round(d)) < 0.01){
      isWheel = true;
      wheelPx = Math.round(d);
    }
    sizeRunway();
  }, {passive:true});

  /* ============================================================
     PLAYHEAD — quantised to frames.
     Two things make this smooth. First the target/ease pair, so coarse
     input still produces continuous motion. Second, and more important,
     the playhead snaps to exact frame boundaries and only seeks when the
     frame index actually changes — asking a decoder for sub-frame
     positions sixty times a second is what makes scrubbing stutter.
     ============================================================ */
  var target = 0, current = 0, raf = null, driveReady = false;
  var EASE = reduced ? 1 : 0.28;
  var lastFrame = -1;

  /* ============================================================
     MOMENTUM — mouse wheel only.
     A wheel emits discrete steps and stops dead; trackpads and touch get
     inertia from the OS for free. So we synthesise it here, and only here,
     rather than fighting the platform's own physics.

     Critically this drives the *scroll position*, not the playhead. If
     momentum were applied to the video directly, the page's scroll and the
     picture would drift apart and snap back together on the next input.
     Moving the scroll keeps the scrollbar, the progress bar, the stats and
     the frame all describing the same moment.

     GAIN and FRICTION are paired: total glide from one impulse is
     delta * GAIN / (1 - FRICTION), so GAIN == 1 - FRICTION makes one notch
     travel exactly one notch's distance — same calibration as before, just
     delivered as a decelerating glide instead of a jump.
     ============================================================ */
  /* Friction sets how long the glide lasts; the pairing keeps where it ends
     up unchanged. At 0.93 velocity was spent in about a second, which read as
     the scroll stopping short. At 0.985 a flick coasts for several seconds
     and decays gently the whole way.

     The stop threshold matters as much as the friction — cutting off at 0.08
     px/frame clipped the tail of the curve, ending the glide while it was
     still visibly moving. Dropping it to 0.01 lets it actually come to rest. */
  var MOM_GAIN = 0.015, MOM_FRICTION = 0.985;
  var MOM_STOP = 0.01;
  var vel = 0, momRaf = null, momPos = 0;

  function momentumStep(){
    var max = runway.offsetHeight - window.innerHeight;
    momPos += vel;
    vel *= MOM_FRICTION;
    if (momPos <= 0){ momPos = 0; vel = 0; }
    else if (momPos >= max){ momPos = max; vel = 0; }
    window.scrollTo(0, momPos);
    if (Math.abs(vel) > MOM_STOP) momRaf = requestAnimationFrame(momentumStep);
    else momRaf = null;
  }

  function wheelDelta(e){
    var d = e.deltaY;
    if (e.deltaMode === 1) d *= 16;
    else if (e.deltaMode === 2) d *= window.innerHeight;
    return d;
  }

  window.addEventListener('wheel', function(e){
    if (state !== 'drive' || !isWheel || reduced) return;
    e.preventDefault();
    /* Re-anchor whenever the glide has settled, so a scrollbar drag or a
       keyboard jump in between is picked up rather than overwritten. */
    if (momRaf === null) momPos = window.scrollY || window.pageYOffset || 0;
    vel += wheelDelta(e) * MOM_GAIN;
    if (momRaf === null) momRaf = requestAnimationFrame(momentumStep);
  }, {passive:false});

  function scrollProgress(){
    var max = runway.offsetHeight - window.innerHeight;
    if (max <= 0) return 0;
    var y = window.scrollY || window.pageYOffset || 0;
    return Math.min(1, Math.max(0, y / max));
  }

  function tick(){
    var d = target - current;
    current += d * EASE;
    if (Math.abs(d) < 0.00025) current = target;

    if (driveReady && frameCount){
      var idx = Math.round(current * (frameCount - 1));
      if (idx !== lastFrame){
        lastFrame = idx;
        var t = Math.min(idx / FPS, vDrive.duration - 0.001);
        try { vDrive.currentTime = t; } catch(e){}
      }
    }

    progBar.style.transform = 'scaleX(' + current + ')';

    STATS.forEach(function(s){
      var show = current >= s.at && current <= s.to;
      if (show !== s.on){
        s.on = show;
        s.el.classList.toggle('show', show);
      }
    });

    if (Math.abs(target - current) > 0.00035){
      raf = requestAnimationFrame(tick);
    } else {
      raf = null;
    }
  }

  function kick(){ if (raf === null) raf = requestAnimationFrame(tick); }

  var cueDone = false;
  function dismissCue(){
    if (cueDone) return;
    cueDone = true;
    cue.classList.remove('on');
    cue.classList.add('off');
    setSubtitle('Scroll to explore');
  }

  window.addEventListener('scroll', function(){
    if (state !== 'drive') return;
    /* Any real movement counts as "they got it" — including a scroll that
       lands back at zero, which is why this keys off the event, not the
       position. */
    dismissCue();
    target = scrollProgress();
    kick();
  }, {passive:true});

  /* ============================================================
     STATE
     ============================================================ */
  var state = 'loop';

  function show(v){
    [vLoop,vLaunch,vDrive].forEach(function(x){ x.classList.toggle('on', x === v); });
  }

  function startLoop(){
    show(vLoop);
    var p = vLoop.play();
    if (p && p.catch) p.catch(function(){});
  }

  function launch(){
    if (state !== 'loop') return;
    state = 'launch';

    hint.classList.add('hidden');
    setSubtitle('Launching');

    /* The car going is what clears the lens. */
    blowing = true;

    /* The click is our one guaranteed user gesture. iOS will not let us
       seek or start audio without it, so everything that needs unlocking
       gets unlocked here — even though playback starts later. */
    vDrive.play().then(function(){ vDrive.pause(); }).catch(function(){});

    vLaunch.currentTime = 0;
    show(vLaunch);
    var p = vLaunch.play();
    if (p && p.catch) p.catch(function(){ toDrive(); });

    /* Hand off slightly before the file ends. Waiting for `ended` shows a
       frozen final frame for a beat, which reads as a stall. */
    var handedOff = false;
    function watch(){
      if (handedOff) return;
      if (vLaunch.duration && vLaunch.currentTime >= vLaunch.duration - 0.18){
        handedOff = true;
        toDrive();
        return;
      }
      requestAnimationFrame(watch);
    }
    requestAnimationFrame(watch);
    vLaunch.addEventListener('ended', function(){
      if (!handedOff){ handedOff = true; toDrive(); }
    }, {once:true});
  }

  function toDrive(){
    if (state === 'drive') return;
    state = 'drive';

    /* The corner label stays quiet while the centre cue is up — two copies
       of the same instruction on screen at once just reads as clutter. It
       takes over once the cue has been dismissed. */
    setSubtitle('');
    prog.classList.add('on');
    setTimeout(function(){ if (!cueDone) cue.classList.add('on'); }, 260);

    vDrive.currentTime = 0;
    driveReady = true;
    show(vDrive);

    /* Unlock the document only now. Scrolling before this point would
       scrub a video that has not been introduced yet. */
    document.body.classList.remove('locked');
    runway.classList.add('live');
    sizeRunway();
    window.scrollTo(0,0);
    target = current = 0;
    lastFrame = -1;
    kick();

    setTimeout(function(){ vLaunch.classList.remove('on'); }, 500);
  }

  stage.addEventListener('click', launch);
  window.addEventListener('keydown', function(e){
    if ((e.code === 'Space' || e.key === ' ') && state === 'loop'){
      e.preventDefault(); launch();
    }
  });

  /* ============================================================
     FX — grain + rain + lens droplets.
     This is the layer that carries the treatment's "physical camera"
     language across all three acts. It also does real repair work: the
     generated footage never produced convincing lens droplets, and its
     rain thins out whenever a shot faces a lit street. Here the density
     is constant regardless of what any individual clip is doing.

     Droplets are real optics. A drop on glass is a strong positive lens with
     a very short focal length: it gathers a WIDE slice of the scene and
     forms a real, INVERTED, minified image of it. So each bead clips a patch
     of the live frame several times its own footprint, flips it, and paints
     that inside its outline — which is why streetlights appear in the wrong
     half of a bead, and why they read as glass rather than as decals.

     The edge then goes dark. At a drop's rim the water surface is nearly
     edge-on to the camera, so light from behind is refracted away or totally
     internally reflected and almost none reaches the sensor. That dark
     meniscus is the single feature that identifies water in every reference
     photograph, and it is the reason this layer cannot be screen-blended.
     ============================================================ */
  var fx = document.getElementById('fx');
  var ctx = fx.getContext('2d', {alpha:true});
  var fxg = document.getElementById('fxg');
  var gctx2 = fxg.getContext('2d', {alpha:true});
  var W = 0, H = 0, DPR = 1;
  var beads = [], runners = [];
  var cov = null;   /* object-fit:cover source rect on vLoop, cached */

  /* Field density. Deliberately traded down from 0.80: every drop is now
     simulated individually through the launch rather than the mist riding a
     baked layer, and that is what the smooth blow-off costs. Losing water is
     the better half of that trade — the motion is the thing people notice. */
  var DENSITY = 0.40;

  /* ---- per-frame source texture ----
     Every drop samples the frame behind it, and sampling a <video> element
     directly re-uploads its texture on each call — with hundreds of drops
     that alone put the loop at ~7fps. Instead the cover-cropped frame is
     blitted ONCE per frame into a small canvas, and every drop samples that.
     Reduced resolution costs nothing visible here because a drop minifies
     what it gathers by SPREAD anyway. */
  var srcCv = document.createElement('canvas');
  var srcCtx = srcCv.getContext('2d', {alpha:false});
  var SW = 0, SH = 0, srcOK = false;

  function sizeSrc(){
    SW = srcCv.width  = 640;
    SH = srcCv.height = Math.max(1, Math.round(640 * (H||1) / (W||1)));
  }

  /* Water only exists in Act 1 and through the launch ramp, so the source is
     the hero loop until the launch clip takes over. Sampling whatever is
     actually on screen keeps the refraction honest across the handoff. */
  function currentVideo(){
    if (blowing && vLaunch && vLaunch.readyState >= 2 && !vLaunch.paused) return vLaunch;
    return vLoop;
  }

  function refreshSrc(vid){
    srcOK = false;
    if (!cov || !vid || vid.readyState < 2) return;
    if (!SW || !SH) sizeSrc();
    try {
      srcCtx.drawImage(vid, cov.sx, cov.sy, cov.sw, cov.sh, 0, 0, SW, SH);
      srcOK = true;
    } catch(e){ /* not decodable yet this frame — skip, not fatal */ }
  }

  /* ---- baked rim sprite ----
     The meniscus gradient is identical for every drop apart from scale, so
     it is baked once and blitted rather than rebuilt per drop per frame.
     createRadialGradient several hundred times a frame was the other half of
     the cost. Only the largest drops still get a path-fitted gradient, where
     the irregular outline is actually visible. */
  var rimCv = document.createElement('canvas');
  var RIMS = 64;
  rimCv.width = rimCv.height = RIMS;
  (function bakeRim(){
    var c = rimCv.getContext('2d');
    var g = c.createRadialGradient(RIMS/2, RIMS/2, RIMS*0.15, RIMS/2, RIMS/2, RIMS*0.5);
    g.addColorStop(0,   'rgba(3,8,11,0)');
    g.addColorStop(0.62,'rgba(3,8,11,.12)');
    g.addColorStop(0.86,'rgba(2,7,10,.52)');
    g.addColorStop(1,   'rgba(1,5,7,.88)');
    c.fillStyle = g;
    c.beginPath(); c.arc(RIMS/2, RIMS/2, RIMS/2, 0, 6.2832); c.fill();
  })();

  /* Water is an Act 1 state. `blowing` starts the moment the car launches
     and never resets — once the lens is clear, it stays clear. */
  var blowing = false, blow = 0;

  /* A bead that has been blown off is parked off-frame rather than
     respawned, so the glass genuinely empties instead of recycling. */
  function offscreenBead(b){
    b.x = -9999; b.y = -9999; b.vx = b.vy = 0; b.a = 0; b.trailPts.length = 0;
    return b;
  }

  /* Mirrors the CSS `object-fit:cover` (+ the 58%-center mobile crop) so
     the refraction sample comes from the same patch of frame the viewer
     is actually looking at behind the drop, not an arbitrary corner of
     the source video. */
  function sizeCover(){
    var vw = vLoop.videoWidth, vh = vLoop.videoHeight;
    if (!vw || !vh){ cov = null; return; }
    var portrait = matchMedia('(max-aspect-ratio:1/1)').matches;
    var posX = portrait ? 0.58 : 0.5, posY = 0.5;
    var vAR = vw / vh, dAR = W / H, sw, sh, sx, sy;
    if (vAR > dAR){ sh = vh; sw = vh * dAR; sx = (vw - sw) * posX; sy = 0; }
    else          { sw = vw; sh = vw / dAR; sx = 0; sy = (vh - sh) * posY; }
    cov = {sx:sx, sy:sy, sw:sw, sh:sh};
  }

  function sizeFx(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = fx.width  = fxg.width  = Math.floor(innerWidth  * DPR);
    H = fx.height = fxg.height = Math.floor(innerHeight * DPR);
    fx.style.width  = fxg.style.width  = innerWidth + 'px';
    fx.style.height = fxg.style.height = innerHeight + 'px';
    sizeCover();
    sizeSrc();
    seed();
  }

  /* Only water on the glass. The falling-rain streaks were removed: the
     footage already carries its own rain, and a second set of synthetic
     vertical lines over the top read as an effect rather than as weather.
     Beads stay because they are the one thing the generation never gave
     us — water sitting on a physical lens.

     Population spans three bands rather than one flat range. The mist band is
     the majority and is what actually reads as a wet surface: sparse large
     drops on their own always look applied rather than landed. Placement is
     clustered around a few centres, because water lands in drifts and a
     uniform scatter reads as noise. */
  function seed(){
    var areaK = (innerWidth * innerHeight) / 1000;
    beads = []; runners = [];

    var nodes = [], q;
    for (q=0;q<7;q++){
      nodes.push({ x:Math.random()*W, y:Math.random()*H,
                   s:(0.18 + Math.random()*0.4) * Math.min(W,H) });
    }
    function place(){
      if (Math.random() < 0.34) return {x:Math.random()*W, y:Math.random()*H};
      var nd = nodes[Math.floor(Math.random()*nodes.length)];
      var ang = Math.random()*6.2832;
      var dist = Math.pow(Math.random(),1.7)*nd.s;
      return {x:nd.x + Math.cos(ang)*dist, y:nd.y + Math.sin(ang)*dist};
    }

    var nMist = Math.round(areaK*1.30*DENSITY);
    var nMid  = Math.round(areaK*0.30*DENSITY);
    var nFat  = Math.round(areaK*0.055*DENSITY);
    var k;
    for (k=0;k<nMist;k++) beads.push(newBead(place(), 0.5, 2.6, 1.5));
    for (k=0;k<nMid; k++) beads.push(newBead(place(), 2.6, 8.5, 1.35));
    for (k=0;k<nFat; k++) beads.push(newBead(place(), 8.5, 20,  2.2));

    /* Runners scale more gently than the field: they are the only thing
       moving before the launch, so thinning them out with everything else
       would leave the glass looking dead. */
    var nRun = Math.max(2, Math.round(innerWidth/210 * DENSITY * 1.6));
    for (k=0;k<nRun;k++) runners.push(newRunner(true));

    mistOK = false; mistDX = 0; mistDY = 0;
  }

  /* The mist band is ~80% of the field by count and, while the lens is still
     wet and undisturbed, it does not move — the idle wobble is 0.05px. Baking
     it once and blitting turns roughly 2,700 path fills per frame into a
     single drawImage. Once airflow starts they scatter, so from then on they
     are drawn live and the bake is abandoned. */
  var mistCv = document.createElement('canvas');
  var mistCtx = mistCv.getContext('2d', {alpha:true});
  var mistOK = false;
  /* Accumulated wind displacement of the baked mist layer, in canvas px. */
  var mistDX = 0, mistDY = 0;

  function bakeMist(){
    if (!W || !H) return;
    mistCv.width = W; mistCv.height = H;
    mistCtx.clearRect(0,0,W,H);
    var save = ctx;
    ctx = mistCtx;                       /* drawDropBody paints to `ctx` */
    try {
      for (var i=0;i<beads.length;i++){
        var b = beads[i];
        if (b.mist && b.x > -9000) drawDropBody(b, b.x, b.y, 1);
      }
    } finally {
      /* Restore unconditionally: if this threw halfway, every later frame
         would otherwise keep painting into the offscreen and the overlay
         would silently vanish. */
      ctx = save;
    }
    mistCtx.globalAlpha = 1;
    mistOK = true;
  }

  /* Beads sit ON the lens. Bigger drops are heavier, so they hold on less and
     run faster once they go.

     Each bead gets a fixed, random outline — a ring of radius multipliers
     baked once at creation — so idle drops read as irregular blobs instead of
     perfect circles. Baking it once (rather than jittering every frame) keeps
     the outline from shimmering; real surface tension holds a stable, if
     lumpy, shape. The multipliers are correlated with their neighbours so the
     result is a lumpy blob rather than an evenly scalloped cog. */
  function newBead(pos, rMin, rMax, curve){
    var r = (rMin + Math.pow(Math.random(),curve)*(rMax-rMin)) * DPR;
    var heavy = Math.min(1, r/(30*DPR));             /* 0..1 mass */
    var n = 7 + Math.floor(Math.random()*4), shape = [];
    var prev = 0.86 + Math.random()*0.28;
    for (var i=0;i<n;i++){
      prev = prev*0.55 + (0.74 + Math.random()*0.5)*0.45;
      shape.push(prev);
    }
    /* Coalescence: a satellite lobe fused to the parent, which is what two
       drops that touched actually look like afterwards. */
    var sat = null;
    if (r > 7*DPR && Math.random() < 0.30){
      var sa = Math.random()*6.2832;
      sat = { dx:Math.cos(sa)*r*0.78, dy:Math.sin(sa)*r*0.78,
              r: r*(0.42 + Math.random()*0.36) };
    }
    return {
      x: pos.x, y: pos.y, r: r,
      mist: r < 4*DPR,          /* baked while idle — see bakeMist */
      a: 0.62 + Math.random()*0.38,
      /* Per-drop highlight strength. Uniformly bright glints on every bead is
         what makes a field read as soap bubbles — real ones have a few
         catching the light hard and most catching it weakly. */
      gs: 0.20 + Math.pow(Math.random(),2.1)*0.95,
      glintAng: -2.30 + (Math.random()-0.5)*0.9,     /* light sits upper-left */
      sat: sat,
      sag: heavy*0.30,                               /* gravity flattens mass */
      vx: 0, vy: 0,
      grav: (0.02 + heavy*0.10) * DPR,               /* heavier runs sooner */
      hold: (1 - heavy) * (120 + Math.random()*680), /* light ones cling    */
      wob: Math.random()*6.28,
      shape: shape,
      trailPts: []                                   /* recent positions, for the wet streak */
    };
  }

  /* A running drop: a bead that has broken loose, towing the wet track it is
     cutting. Head and tail are one body of water and share one code path —
     drawn separately they read as two effects bolted together. */
  function newRunner(anywhere){
    var r = (7 + Math.pow(Math.random(),1.4)*13) * DPR;
    var n = 7 + Math.floor(Math.random()*4), shape = [];
    var prev = 0.86 + Math.random()*0.28;
    for (var i=0;i<n;i++){
      prev = prev*0.55 + (0.74 + Math.random()*0.5)*0.45;
      shape.push(prev);
    }
    return {
      x: Math.random()*W,
      y: anywhere ? Math.random()*H : -30*DPR,
      r: r, shape: shape, sat: null, sag: 0.30,
      a: 0.72 + Math.random()*0.28,
      gs: 0.3 + Math.pow(Math.random(),1.8)*0.85,
      glintAng: -2.30 + (Math.random()-0.5)*0.9,
      vy: (0.6 + Math.random()*1.5)*DPR, vx: 0, drift: 0,
      /* Stall and release. Water pins on a speck, builds up behind it, then
         breaks free and accelerates. It is the most recognisable thing about
         a drop running down glass, and constant velocity kills it instantly. */
      stall: Math.random() < 0.5 ? (30 + Math.random()*90) : 0,
      tail: [], grav: 0.02*DPR, hold: 0,
      wob: Math.random()*6.2832, trailPts: []
    };
  }

  /* Traces a smooth closed blob through `shape`'s radius multipliers —
     quadratic curves through each edge's midpoint round the lobes off so
     the result reads as lumpy water, not a gear. `stretchY` elongates it
     vertically, used to make a resting drop look slightly teardrop-heavy
     even before it starts running. */
  function blobPath(cx, cy, r, shape, stretchY){
    var n = shape.length, pts = [];
    for (var i=0;i<n;i++){
      var ang = (i/n) * Math.PI * 2;
      pts.push([
        cx + Math.cos(ang) * r * shape[i],
        cy + Math.sin(ang) * r * shape[i] * (1 + stretchY)
      ]);
    }
    ctx.beginPath();
    var mid0 = [(pts[0][0]+pts[n-1][0])/2, (pts[0][1]+pts[n-1][1])/2];
    ctx.moveTo(mid0[0], mid0[1]);
    for (var j=0;j<n;j++){
      var p1 = pts[j], p2 = pts[(j+1)%n];
      ctx.quadraticCurveTo(p1[0], p1[1], (p1[0]+p2[0])/2, (p1[1]+p2[1])/2);
    }
    ctx.closePath();
  }

  /* Outline of a bead, including its fused satellite lobe if it has one. */
  function dropPath(d, cx, cy){
    blobPath(cx, cy, d.r, d.shape, d.sag);
    if (d.sat){
      ctx.moveTo(cx + d.sat.dx + d.sat.r, cy + d.sat.dy);
      ctx.arc(cx + d.sat.dx, cy + d.sat.dy, d.sat.r, 0, 6.2832);
    }
  }

  /* SPREAD > 1 is the minification: the drop gathers a slice of the scene
     several times its own footprint and squeezes it in. Combined with the
     180-degree rotation, that is the whole of a droplet's optics. */
  var SPREAD = 4.2;

  /* Clips to whatever path is current on `ctx` and paints the inverted,
     minified sample of the live frame inside it. Skipped for the smallest
     mist motes: at that size it's imperceptible and it is the single most
     expensive call per bead, so this is where the frame budget goes. */
  function refract(d, cx, cy){
    if (!srcOK) return false;
    var size = (d.r*2) * (SW/W) * SPREAD;
    var vx = (cx/W) * SW;
    var vy = (cy/H) * SH;
    var R = d.r*1.05;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.PI);
    ctx.translate(-cx, -cy);
    ctx.globalAlpha = 1;
    try {
      ctx.drawImage(srcCv, vx-size/2, vy-size/2, size, size, cx-R, cy-R, R*2, R*2);
    } catch(e){ /* not decodable yet this frame — skip, not fatal */ }
    ctx.restore();
    return true;
  }

  /* ---- channels: a runner's tail ----
     A vertical channel of water is optically a CYLINDRICAL lens. It bends
     light in the horizontal plane only, so the scene inside is flipped
     left-to-right and squeezed sideways while vertically it passes through
     almost untouched. A bead inverts both axes; a channel inverts one. */
  function channelAt(pts, y){
    if (pts.length < 2) return null;
    if (y < pts[0].y || y > pts[pts.length-1].y) return null;
    for (var i=1;i<pts.length;i++){
      if (y <= pts[i].y){
        var p0 = pts[i-1], p1 = pts[i];
        var t = (y - p0.y) / Math.max(0.0001, (p1.y - p0.y));
        t = t*t*(3-2*t);
        return { cx: p0.x + (p1.x-p0.x)*t, hw: (p0.w + (p1.w-p0.w)*t)*0.5 };
      }
    }
    return null;
  }

  function channelOutline(pts){
    var i, a;
    ctx.beginPath();
    for (i=0;i<pts.length;i++){
      a = channelAt(pts, pts[i].y) || {cx:pts[i].x, hw:pts[i].w/2};
      if (i===0) ctx.moveTo(a.cx - a.hw, pts[i].y);
      else       ctx.lineTo(a.cx - a.hw, pts[i].y);
    }
    for (i=pts.length-1;i>=0;i--){
      a = channelAt(pts, pts[i].y) || {cx:pts[i].x, hw:pts[i].w/2};
      ctx.lineTo(a.cx + a.hw, pts[i].y);
    }
    ctx.closePath();
  }

  function drawChannel(pts, wet, alpha){
    if (!pts || pts.length < 2) return;
    var y0 = pts[0].y, y1 = pts[pts.length-1].y;

    ctx.save();
    channelOutline(pts);
    ctx.clip();
    if (srcOK){
      var band = 9*DPR;
      for (var y=y0; y<y1; y+=band){
        var a = channelAt(pts, y);
        if (!a || a.hw <= 0) continue;
        var sw2 = (a.hw*2)*(SW/W)*2.4;
        var sh2 = band*(SH/H);
        var vx = (a.cx/W)*SW;
        var vy = (y/H)*SH;
        ctx.save();
        ctx.globalAlpha = alpha*wet;
        ctx.translate(a.cx, 0); ctx.scale(-1, 1); ctx.translate(-a.cx, 0);
        try{
          ctx.drawImage(srcCv, vx-sw2/2, vy-sh2/2, sw2, sh2,
                        a.cx-a.hw, y-band*0.5, a.hw*2, band*1.6);
        }catch(e){}
        ctx.restore();
      }
    }
    ctx.restore();

    channelOutline(pts);
    ctx.globalAlpha = alpha*wet*0.85;
    ctx.lineWidth = 1.3*DPR;
    ctx.strokeStyle = 'rgba(2,7,10,.52)';
    ctx.stroke();

    /* Broken highlight. An unbroken bright line the full length of a channel
       reads as a glass rod — real water catches the light only where the
       surface happens to be angled right. */
    ctx.globalAlpha = alpha*wet*0.42;
    ctx.lineWidth = 1.1*DPR;
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(236,250,255,.7)';
    var run = null;
    for (var k=0;k<pts.length;k++){
      var s = channelAt(pts, pts[k].y);
      var lit = s && s.hw > 1.6*DPR && ((k*2654435761 % 101)/101) < 0.62;
      if (lit){
        var sx = s.cx - s.hw*0.44;
        if (!run){ ctx.beginPath(); ctx.moveTo(sx, pts[k].y); run = true; }
        else ctx.lineTo(sx, pts[k].y);
      } else if (run){ ctx.stroke(); run = null; }
    }
    if (run) ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.globalAlpha = 1;
  }

  /* One bead, fully rendered: refracted scene, meniscus, caustic, glint.
     Runners share this exact routine for their heads. */
  function drawDropBody(d, cx, cy, wet){
    var R = d.r;
    ctx.globalAlpha = d.a * wet;

    /* Tier 0 — mist. These are the overwhelming majority by count, and at a
       few pixels across none of the optics below is resolvable. Giving them
       a path, a clip and a gradient anyway is what made this unshippable, so
       they get a dot and a highlight and nothing else. */
    if (R < 4*DPR){
      ctx.globalAlpha = d.a * wet * 0.62;
      ctx.fillStyle = 'rgba(150,183,206,.55)';
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = d.a * wet * 0.8 * d.gs;
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.beginPath();
      ctx.arc(cx - R*0.24, cy - R*0.26, Math.max(0.4, R*0.38), 0, 6.2832);
      ctx.fill();
      return;
    }

    var big = R >= 18*DPR;

    /* 1 — the refracted scene, clipped to the drop. The lumpy outline is only
       built where it can be seen: on large drops, and on any drop carrying a
       fused satellite lobe. Everything else clips to a plain arc, which skips
       eight quadratic curves per drop per frame and looks identical at these
       sizes — the rim below is already the circular sprite. */
    if (big || d.sat) dropPath(d, cx, cy);
    else { ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); }
    ctx.save();
    ctx.clip();
    if (!refract(d, cx, cy)){
      ctx.globalAlpha = d.a * wet * 0.5;
      ctx.fillStyle = 'rgba(206,229,244,.5)';
      ctx.fill();
    }
    ctx.restore();

    /* 2 — the meniscus. Light at the rim is refracted away from the camera
       entirely, so the edge goes dark. This is the feature a screen-blended
       layer could not produce at any setting.

       Only the largest drops get a gradient fitted to their actual outline;
       below that the baked circular sprite is indistinguishable and costs one
       blit instead of building a gradient object every frame. */
    ctx.globalAlpha = Math.min(1, d.a * wet);
    if (big){
      dropPath(d, cx, cy);
      var rg = ctx.createRadialGradient(cx, cy, R*0.30, cx, cy, R*1.06);
      rg.addColorStop(0,   'rgba(3,8,11,0)');
      rg.addColorStop(0.62,'rgba(3,8,11,.12)');
      rg.addColorStop(0.86,'rgba(2,7,10,.52)');
      rg.addColorStop(1,   'rgba(1,5,7,.88)');
      ctx.fillStyle = rg;
      ctx.fill();
      ctx.lineWidth = Math.max(0.8, R*0.055);
      ctx.strokeStyle = 'rgba(1,5,8,.5)';
      ctx.stroke();
    } else {
      var S = R*2.12;
      ctx.drawImage(rimCv, cx - S/2, cy - S/2, S, S);
    }

    /* 3 — caustic: the bright arc opposite the light, where rays converge
       through the far wall. Deliberately faint and only on large drops — at
       full strength it closes into a continuous ring, and a rim-lit ring is
       a soap bubble, not a droplet. */
    if (big){
      ctx.globalAlpha = d.a * wet * 0.22 * d.gs;
      ctx.beginPath();
      ctx.arc(cx, cy, R*0.84, d.glintAng+Math.PI-0.6, d.glintAng+Math.PI+0.6);
      ctx.lineWidth = Math.max(1, R*0.09);
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(206,232,252,.4)';
      ctx.stroke();
    }

    /* 4 — specular. A curved sliver, because the source is broad and the
       surface curved. A circle is the giveaway at any size above a few px.
       The tight hot core is a second stroke, so it is spent only where it
       can actually be seen. */
    ctx.globalAlpha = Math.min(1, d.a * wet * 0.85 * d.gs);
    ctx.beginPath();
    ctx.arc(cx, cy, R*0.62, d.glintAng-0.5, d.glintAng+0.5);
    ctx.lineWidth = Math.max(0.8, R*0.125);
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.stroke();
    if (big){
      ctx.globalAlpha = Math.min(1, d.a * wet * 0.95 * d.gs);
      ctx.beginPath();
      ctx.arc(cx, cy, R*0.62, d.glintAng-0.17, d.glintAng+0.17);
      ctx.lineWidth = Math.max(0.6, R*0.075);
      ctx.strokeStyle = '#fff';
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
  }

  /* A runner: the wet track it is cutting, then its head. The trail is
     narrower than the drop itself — the drop carries most of the water with
     it and leaves only a wetted track behind. */
  function drawRunner(rn, wet){
    if (rn.tail && rn.tail.length > 1){
      var pts = [];
      for (var i=0;i<rn.tail.length;i++){
        var f = i/(rn.tail.length-1);          /* 0 = oldest, 1 = at the head */
        pts.push({x:rn.tail[i].x, y:rn.tail[i].y, w:rn.r*2*(0.10 + f*0.52)});
      }
      drawChannel(pts, wet, 0.85);
    }
    drawDropBody(rn, rn.x, rn.y, wet);
  }

  /* Runners advance whether or not the lens is being blown clear — they are
     the one thing on the glass that is always in motion. */
  function stepRunners(dt, wind, gust, chase){
    for (var i=0;i<runners.length;i++){
      var rn = runners[i];
      if (rn.x < -9000) continue;

      if (rn.stall > 0 && wind < 0.02){
        rn.stall -= dt;
        rn.wob += 0.05 * dt;
        rn.x += Math.sin(rn.wob)*0.06*DPR*dt;
        if (rn.stall <= 0){ rn.stall = 0; rn.vy = Math.max(rn.vy, 0.5*DPR); }
        continue;
      }

      rn.vy += 0.035*DPR*dt;
      if (wind > 0){
        var area = rn.r/(10*DPR);
        rn.vy += wind*DPR*area*(0.55*chase - 0.45*gust)*dt;
        rn.vx += wind*DPR*area*(0.95*gust + 0.20*chase)*dt;
      }
      rn.vy = Math.min(rn.vy, 5.5*DPR);

      /* Friction is exponential, so it decays by k steps rather than once. */
      rn.drift = rn.drift*Math.pow(0.86, dt) + (Math.random()-0.5)*0.20*DPR*dt;
      rn.x += (rn.drift + rn.vx) * dt;
      rn.y += rn.vy * dt;

      if (wind < 0.02 && rn.vy < 1.6*DPR && Math.random() < 0.006*dt){
        rn.stall = 20 + Math.random()*70;
        rn.vy *= 0.3;
      }

      rn.tail.push({x:rn.x, y:rn.y});
      var maxTail = Math.round(8 + Math.min(26, rn.vy/DPR*9));
      while (rn.tail.length > maxTail) rn.tail.shift();

      if (rn.y - rn.r > H || rn.x + rn.r < 0 || rn.x - rn.r > W){
        if (wind > 0.02){ rn.x = -9999; }
        else {
          rn.x = Math.random()*W; rn.y = -20*DPR;
          rn.vy = (0.6 + Math.random()*1.5)*DPR; rn.vx = 0; rn.drift = 0;
          rn.tail.length = 0;
          rn.stall = Math.random() < 0.5 ? (20 + Math.random()*80) : 0;
        }
      }
    }
  }

  var grain = document.createElement('canvas');
  var gctx = grain.getContext('2d');
  var GS = 128;
  grain.width = grain.height = GS;
  var grainFrames = [], gi = 0;

  function bakeGrain(){
    grainFrames = [];
    for (var f=0; f<3; f++){
      var img = gctx.createImageData(GS, GS);
      for (var i=0;i<img.data.length;i+=4){
        var v = 118 + (Math.random()*74 - 37);
        img.data[i]=img.data[i+1]=img.data[i+2]=v;
        img.data[i+3]=15;
      }
      var c = document.createElement('canvas');
      c.width=c.height=GS;
      c.getContext('2d').putImageData(img,0,0);
      grainFrames.push(c);
    }
  }

  /* The launch clear takes this many seconds of wall-clock, whatever the
     frame rate happens to be doing. */
  var BLOW_SECONDS = 3;

  var last = 0, gswap = 0;
  function drawFx(now){
    requestAnimationFrame(drawFx);
    if (now - last < 1000/30) return;   /* 30fps is plenty and halves cost */
    var delta = last ? now - last : 1000/30;
    last = now;

    /* How many 30fps steps this frame covers. Every physics increment below
       is scaled by it, so a dropped frame advances the simulation by the
       right amount instead of simply losing that motion. Clamped so a long
       stall (tab hidden, GC pause) cannot teleport everything at once.

       Named `dt` and never `k`: `k` was already a loop counter further down
       this same function, and since `var` is function-scoped rather than
       block-scoped the trail loop silently overwrote this value with its own
       index — zero whenever nothing was moving. Every physics increment then
       multiplied by zero, which froze the runners outright and turned the
       launch into a plain fade. One shadowed name, both symptoms. */
    var dt = Math.max(0.2, Math.min(3, delta / (1000/30)));

    ctx.clearRect(0,0,W,H);

    /* Airflow ramp. Before launch the camera is idling and water sits on
       the glass. From the moment the car goes, airflow over the housing
       builds and strips the lens clear — so `blow` drives both the wind
       force and the fade, and the water never comes back.

       This is measured in SECONDS, not frames. Counting frames meant the
       clear took 133 of them however long they took, and since the launch is
       also the most expensive moment to render, a measured 16.7s clear
       against a designed 4.4s. Elapsed time cannot drift like that. */
    if (blowing && blow < 1) blow = Math.min(1, blow + (delta/1000)/BLOW_SECONDS);
    var wet = 1 - blow;                       /* how much water remains */
    var wind = blow * blow;                   /* force ramps in, not linear */
    var gust  = Math.max(0, 1 - blow * 2.2);  /* the close pass + whip  */
    var chase = Math.min(1, blow * 1.35);     /* settled in, now chasing */

    /* One video-to-canvas blit per frame feeds every drop's refraction. */
    if (wet > 0.001) refreshSrc(currentVideo());

    /* lens beads — water sitting on the glass */
    if (wet > 0.001){
      /* While the lens is undisturbed the fine mist — the large majority of
         the field by count — is baked once and blitted, which costs nothing
         because none of it is moving. The moment airflow starts the cache is
         abandoned and every mote is simulated on its own.

         Sliding the baked layer as a unit was tried instead and rejected: it
         is far cheaper, but every mote then shares one motion, so the launch
         reads as a sheet drifting rather than as water being stripped off the
         glass. Individual simulation is the whole point of that moment, and
         the field is sized so it can be afforded. */
      var useBake = !blowing;
      if (useBake){
        if (!mistOK) bakeMist();
        ctx.globalAlpha = wet;
        ctx.drawImage(mistCv, 0, 0);
        ctx.globalAlpha = 1;
      }

      for (var j=0;j<beads.length;j++){
        var b = beads[j];
        if (useBake && b.mist) continue;      /* already in the baked layer */
        if (b.x < -9000) continue;
        var running = !(b.hold > 0 && wind < 0.02);

        /* --- wet streak: a fading chain of shrinking stamps left where
           the drop has already passed, not a solid rectangle. Each stamp
           is a soft small blob, so the streak looks like clinging water
           rather than a drawn line. Aged out from the tail forward. */
        for (var tI=0;tI<b.trailPts.length;tI++){
          var tp = b.trailPts[tI];
          tp.age += dt;
          var life = 1 - tp.age / tp.life;
          if (life <= 0) continue;
          ctx.globalAlpha = b.a * wet * life * .5;
          var tg = ctx.createRadialGradient(tp.x,tp.y,0,tp.x,tp.y,tp.r);
          tg.addColorStop(0,'rgba(210,230,245,.85)');
          tg.addColorStop(1,'rgba(150,182,205,0)');
          ctx.fillStyle = tg;
          ctx.beginPath(); ctx.arc(tp.x,tp.y,tp.r,0,6.2832); ctx.fill();
        }
        while (b.trailPts.length && b.trailPts[0].age >= b.trailPts[0].life) b.trailPts.shift();

        /* --- the drop body itself --- */
        drawDropBody(b, b.x, b.y, wet);

        if (!running){
          /* idling: surface tension holds it, with a faint wobble */
          b.hold -= dt;
          b.wob += 0.03 * dt;
          b.x += Math.sin(b.wob) * 0.05 * DPR * dt;
        } else {
          /* Released, or torn loose by airflow. Direction here isn't
             arbitrary — it's keyed to what actually happens on screen in
             act2-launch.mp4. The car blasts past close enough to fill the
             frame, and the camera whip-pans to follow it: background
             highlights streak screen-right during that pan (visible in the
             footage as the motion-blur trail across the roofline at
             t≈3.6s), so that's a gust, not a generic breeze — it should
             throw loose water rightward and slightly up, same as anything
             light gets flung outward when a vehicle screams past close by.
             Only once the whip lands and the car settles into driving away
             (the back half of the blow ramp) does the camera fall in
             behind it and start actually chasing — from then on the
             dominant force is forward-flight airflow over the housing,
             which reinforces gravity (strips water straight down and off
             the bottom edge) rather than fighting it, continuing rightward
             rather than reversing since the airflow never changes source.
             Larger beads catch more air either way, so they leave first
             and fastest. */
          var area = b.r / (10*DPR);
          b.vy += (b.grav + wind * DPR * area * (0.55*chase - 0.45*gust)) * dt;
          b.vx += wind * DPR * area * (0.95*gust + 0.20*chase) * dt;
          b.x += b.vx * dt;
          b.y += b.vy * dt;

          if (Math.sqrt(b.vx*b.vx + b.vy*b.vy) > 0.25*DPR){
            b.trailPts.push({x:b.x, y:b.y, r:b.r*0.6, age:0, life:14});
            if (b.trailPts.length > 12) b.trailPts.shift();
          }

          var gone = b.y - b.r > H || b.y + b.r < 0 || b.x + b.r < 0;
          if (gone){
            beads[j] = wind > 0.02
              ? offscreenBead(b)
              : newBead({x:Math.random()*W, y:Math.random()*H}, 0.5, 20, 1.6);
          }
        }
      }

      /* running drops, on top of the resting field */
      stepRunners(dt, wind, gust, chase);
      for (var q=0;q<runners.length;q++){
        if (runners[q].x < -9000) continue;
        drawRunner(runners[q], wet);
      }
    }
    ctx.globalAlpha = 1;

    /* Grain lives on its own screen-blended layer — it is additive luminance
       noise, and on the water layer (which composites normally now) it would
       wash the frame toward grey instead of sparkling. */
    if (grainFrames.length){
      if (now - gswap > 70){ gi = (gi+1) % grainFrames.length; gswap = now; }
      gctx2.clearRect(0,0,W,H);
      gctx2.globalAlpha = 1;
      var gp = gctx2.createPattern(grainFrames[gi],'repeat');
      gctx2.fillStyle = gp;
      gctx2.fillRect(0,0,W,H);
    }
    ctx.globalAlpha = 1;
  }

  /* ============================================================
     BOOT
     ============================================================ */
  function boot(){
    sizeFx();
    bakeGrain();
    if (!reduced) requestAnimationFrame(drawFx);
    startLoop();

    /* Lift the veil only once the loop has a frame to show, so we never
       dissolve from black to black. The poster covers the gap if the video
       is slow, and a timeout guarantees we never strand the visitor behind
       an opaque screen if it fails outright. */
    var veil = document.getElementById('veil');
    var lifted = false;
    function lift(){
      if (lifted) return;
      lifted = true;
      requestAnimationFrame(function(){ veil.classList.add('lift'); });
    }
    if (vLoop.readyState >= 2) lift();
    else vLoop.addEventListener('loadeddata', lift, {once:true});
    setTimeout(lift, 1800);

    /* Refraction needs vLoop's natural size, which isn't known until it
       has data — sizeFx() above likely ran before that, so recompute the
       cover-crop rect once dimensions exist rather than leaving beads
       stuck sampling nothing. */
    if (vLoop.videoWidth) sizeCover();
    else vLoop.addEventListener('loadeddata', sizeCover, {once:true});
  }

  var rs;
  window.addEventListener('resize', function(){
    clearTimeout(rs);
    rs = setTimeout(function(){
      sizeFx();
      if (state === 'drive'){ target = scrollProgress(); kick(); }
    }, 160);
  });

  vDrive.addEventListener('loadedmetadata', function(){
    frameCount = Math.max(1, Math.round(vDrive.duration * FPS));
    sizeRunway();
    kick();
  });

  /* iOS occasionally drops a paused-and-seeked video's frame when the tab
     is restored. Nudging currentTime forces it to repaint. */
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && state === 'drive' && vDrive.duration){
      try { vDrive.currentTime = Math.min(vDrive.duration - .05, vDrive.currentTime + .001); } catch(e){}
    }
  });

  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
})();
</script>
</body>
