<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>work in progress</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --paper: #F6F4EF;
    --ink: #1D1C19;
    --ink-soft: #6B675E;
    --accent: #4C5D56;
    --line: #D9D5CC;
    --box: #EFEBE2;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1D1C19;
      --ink: #F6F4EF;
      --ink-soft: #A8A399;
      --accent: #8FA698;
      --line: #3A382F;
      --box: #2A2823;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  html { scrollbar-gutter: stable; }
  /* Opt out of browser scroll-anchoring — it tries to auto-adjust scroll
     position when content changes size near the top of the page, which
     fights our own explicit scroll resets during view swaps (we replace a
     very tall page with a short one right at scrollY 0). */
  html, body { overflow-anchor: none; }
  body { background: var(--paper); color: var(--ink); font-family: 'Space Mono', monospace; overflow-x: hidden; }
  .view, .view * { font-family: 'Space Mono', monospace !important; }
  #menuBtn, #panel, #scrim { display: none !important; }

  .view {
    display: none;
    min-height: 100vh;
    animation: fadeIn 0.5s ease;
  }
  .view.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* Subgrid/detail/contact are always their own independently-scrolling
     panel, pinned to the viewport, whenever active — decoupled entirely from
     the home page's own scroll position. This guarantees they start at their
     own top no matter where the previous page was scrolled to, without
     needing to chase/reset a shared window scroll position at the right
     moment (only #view-home uses the document's own scroll, for the
     continuous hero-to-grid shatter effect). */
  .panel-view.active {
    position: fixed;
    inset: 0;
    z-index: 35;
    overflow-y: auto;
    background: var(--paper);
  }

  /* ---------- HERO ---------- */
  #heroSection { display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; height: 100dvh; height: 100lvh; z-index: 2; overflow: hidden; background: var(--paper); }
  .hero-frame { position: absolute; top: 32px; left: 32px; right: 32px; display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .question { font-weight: 300; font-style: italic; font-size: clamp(2.5rem, 8vw, 5.5rem); line-height: 1.1; text-align: center; transition: opacity 0.5s ease; color: var(--ink); }
  .question .mark { display: inline-block; color: var(--accent); transition: transform 0.4s ease; }
  #heroSection:hover .mark { transform: translateY(-4px) rotate(-4deg); }
  .hint { position: absolute; top: 0; left: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); opacity: 0.85; white-space: nowrap; will-change: transform; backface-visibility: hidden; -webkit-font-smoothing: antialiased; }

  /* Wraps the heading purely as a sizing/positioning reference for the shard
     overlay below — it shrink-wraps to the heading's real rendered box via
     normal CSS layout, so the overlay always matches exactly (no JS-measured
     pixel values to keep in sync across font loads, resizes, etc.). */
  .question-wrap { position: relative; }

  /* Shatter effect: the heading is cloned into a grid of clipped shards that
     fly apart and fade, standing in for the real (now-hidden) heading. Their
     transform/opacity are driven directly by scroll position (see the scroll
     listener), not a timed animation, so the effect scrubs with the scroll
     and can stop/reverse partway through. No transition here on purpose —
     it needs to track scroll 1:1, not lag behind it. */
  .shatter-container { position: absolute; inset: 0; pointer-events: none; }
  .shatter-shard {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    will-change: transform, opacity;
  }
  /* The cloned heading keeps its own natural (non-flex) layout so its <br>
     line-break still renders correctly — only centered by its shard parent. */
  .shatter-shard .question { transition: none; margin: 0; }

  /* ---------- HEADER (grid/subgrid/detail views) ---------- */
  .frame { padding: 100px 40px 0; position: relative; z-index: 10; }
  @media (max-width: 640px) { .frame { padding: 88px 20px 0; } }
  .crumb { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); text-decoration: none; cursor: pointer; }
  .crumb:hover { color: var(--accent); }
  .frame h1 { font-weight: 300; font-style: italic; font-size: clamp(2rem, 5vw, 3.2rem); margin-top: 14px; color: var(--ink); }
  .frame p.sub { margin-top: 10px; color: var(--ink-soft); font-size: 1rem; max-width: 46ch; }

  #exploreSection {
    position: relative;
    background: var(--paper);
  }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; padding: 60px 40px 60px; max-width: 980px; margin: 0 auto; }
  @media (max-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 88px 16px 40px; } }
  #subgridBoxes { padding-top: 28px; }
  @media (max-width: 640px) { #subgridBoxes { padding-top: 20px; } }

  .box { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 1 / 1; background: var(--box); cursor: pointer; border: 1px solid var(--line); transition: transform 0.35s ease, box-shadow 0.35s ease; transform-style: preserve-3d; }
  .box:hover { transform: translateY(-4px); box-shadow: 0 14px 30px -18px rgba(29,28,25,0.35); }
  .photo { position: absolute; inset: 0; transition: transform 0.5s ease; }
  .box:hover .photo { transform: scale(1.04); }

  /* Mouse-tracking 3D tilt — desktop pointers only, never affects touch devices */
  @media (hover: hover) and (pointer: fine) {
    .grid { perspective: 900px; }
    .box.tilting {
      transition: transform 0.12s ease-out, box-shadow 0.2s ease;
      transform:
        translateY(-4px)
        rotateX(var(--tiltX, 0deg))
        rotateY(var(--tiltY, 0deg));
      box-shadow: 0 20px 40px -20px rgba(29,28,25,0.45);
    }
    /* keep the photo's subtle zoom while tilting */
    .box.tilting .photo { transform: scale(1.06); }
  }
  .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(29,28,25,0) 40%, rgba(29,28,25,0.55) 100%); }
  .label { position: absolute; left: 20px; bottom: 18px; right: 20px; color: #F6F4EF; }
  .label .index { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.85; margin-bottom: 4px; display: block; }
  .label .title { font-family: 'Newsreader', serif; font-weight: 400; font-size: 1.5rem; }
  .label .note { font-family: 'IBM Plex Mono', monospace; font-size: 10px; opacity: 0.85; margin-top: 4px; display: block; }

  .box.last { grid-column: 1 / -1; max-width: calc(50% - 9px); margin-left: 0; margin-right: auto; width: 100%; }
  @media (max-width: 640px) { .box.last { max-width: calc(50% - 6px); } }

  /* Card-tap zoom transition */
  .box.zooming {
    z-index: 30;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
    will-change: transform, opacity;
  }
  .view.entering {
    animation: viewEnter 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes viewEnter {
    from { opacity: 0; transform: scale(1.04); }
    to { opacity: 1; transform: scale(1); }
  }

  /* Crossfade states: the incoming page is mounted invisibly (prefade),
     then faded in over the tail of the zoom (crossfading) for a true dissolve.
     Both suppress the base .view fadeIn animation so the opacity transition
     is what actually drives the fade (an active animation would override it). */
  .view.prefade {
    opacity: 0;
    animation: none;
  }
  .view.crossfading {
    opacity: 1;
    animation: none;
    transition: opacity 0.3s ease-in;
  }
  /* Stable resting state after a crossfade — no animation ever re-runs. */
  .view.settled {
    opacity: 1;
    animation: none;
  }

  /* Phase 1: fade everything except the tapped card */
  .grid.isolating .box:not(.isolated-card) {
    transition: opacity 0.35s ease;
    opacity: 0;
    pointer-events: none;
  }
  /* fade out surrounding chrome (title, subtitle, back button) too */
  #view-subgrid.isolating .frame,
  #view-home.isolating #heroSection {
    transition: opacity 0.35s ease;
    opacity: 0;
  }
  .menu-btn.fading { transition: opacity 0.35s ease; opacity: 0 !important; }

  /* ---------- DETAIL ---------- */
  .content { max-width: 680px; margin: 0 auto; padding: 60px 40px 100px; }
  @media (max-width: 640px) { .content { padding: 40px 22px 80px; } }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
  .content h1 { font-weight: 300; font-style: italic; font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: 1.1; margin-bottom: 28px; color: var(--ink); }
  .lede { font-size: 1.2rem; line-height: 1.6; margin-bottom: 24px; }
  .body-text { font-size: 1.05rem; line-height: 1.75; color: var(--ink-soft); margin-bottom: 20px; }
  .divider { height: 1px; background: var(--line); margin: 44px 0; }
  .marker-list { display: flex; flex-direction: column; gap: 22px; }
  .marker { display: flex; gap: 18px; align-items: baseline; }
  .marker .year { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); min-width: 44px; }
  .marker .desc { font-size: 1.05rem; line-height: 1.5; }

  /* ---------- HAMBURGER + PANEL ---------- */
  .menu-btn { position: fixed; top: 32px; left: 40px; z-index: 60; width: 34px; height: 26px; display: flex; flex-direction: column; justify-content: space-between; background: none; border: none; cursor: pointer; padding: 0; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
  .menu-btn.visible { opacity: 1; pointer-events: auto; }
  .menu-btn span { display: block; height: 2px; width: 100%; background: var(--ink); border-radius: 1px; transition: transform 0.35s ease, opacity 0.25s ease; }
  .menu-btn.open span:nth-child(1) { transform: translateY(12px) rotate(45deg); }
  .menu-btn.open span:nth-child(2) { opacity: 0; }
  .menu-btn.open span:nth-child(3) { transform: translateY(-12px) rotate(-45deg); }
  @media (max-width: 640px) { .menu-btn { left: 20px; top: 24px; } }

  .scrim { position: fixed; inset: 0; background: rgba(29,28,25,0.25); opacity: 0; pointer-events: none; transition: opacity 0.4s ease; z-index: 40; }
  .scrim.show { opacity: 1; pointer-events: auto; }

  .panel { position: fixed; top: 0; left: 0; height: 100vh; width: min(320px, 82vw); background: var(--paper); border-right: 1px solid var(--line); z-index: 45; transform: translateX(-100%); transition: transform 0.45s cubic-bezier(0.4,0,0.2,1); display: flex; flex-direction: column; padding: 100px 36px 40px; }
  .panel.show { transform: translateX(0); }
  .panel .nav-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 18px; }
  .panel nav { display: flex; flex-direction: column; gap: 4px; }
  .panel nav a { font-family: 'Newsreader', serif; font-style: italic; font-weight: 300; font-size: 1.3rem; color: var(--ink); text-decoration: none; padding: 10px 0; border-bottom: 1px solid transparent; transition: color 0.25s ease, border-color 0.25s ease; cursor: pointer; }
  .panel nav a:hover { color: var(--accent); border-color: var(--line); }
  .panel nav a.home { font-style: normal; font-weight: 400; }
  .panel .divider { height: 1px; background: var(--line); margin: 14px 0; }
  .panel .reach { margin-top: auto; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent); padding-bottom: 3px; width: fit-content; cursor: pointer; }

  .placeholder-note { color: var(--ink-soft); font-size: 0.95rem; font-family: 'IBM Plex Mono', monospace; }

  /* ---------- SOCIAL ROW ---------- */
  .social-row { display: flex; gap: 14px; margin: 8px 0 40px; }
  .social-icon {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.3s ease, background 0.3s ease;
    border: none; padding: 0; cursor: pointer; position: relative;
  }
  .social-icon:hover { transform: translateY(-3px); background: var(--ink); }

  .contact-heading {
    font-family: 'Newsreader', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    line-height: 1.1;
    margin-bottom: 28px;
    color: var(--ink);
  }

  .copied-toast {
    position: absolute;
    top: -34px;
    left: 50%;
    transform: translateX(-50%) translateY(6px);
    background: var(--ink);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 6px 10px;
    border-radius: 8px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .copied-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ---------- CONTACT FORM ---------- */
  .contact-form { max-width: 480px; }
  .contact-form input[type="text"] {
    width: 100%;
    background: var(--box);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 12px;
    font-family: 'Newsreader', serif;
    font-size: 1rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.25s ease;
  }
  .contact-form input[type="text"]:focus { border-color: var(--accent); }
  .contact-form input[type="text"]::placeholder { color: var(--ink-soft); font-style: italic; }
  .contact-form textarea {
    width: 100%;
    background: var(--box);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    font-family: 'Newsreader', serif;
    font-size: 1rem;
    color: var(--ink);
    resize: vertical;
    outline: none;
    transition: border-color 0.25s ease;
  }
  .contact-form textarea:focus { border-color: var(--accent); }
  .contact-form textarea::placeholder { color: var(--ink-soft); font-style: italic; }

  .contact-form button {
    margin-top: 16px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #FFFFFF;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    padding: 12px 28px;
    cursor: pointer;
    transition: background 0.25s ease, transform 0.25s ease;
  }
  .contact-form button:hover { background: var(--ink); transform: translateY(-2px); }

  .send-note {
    margin-top: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  /* ---------- CUBE VIEW ("dangcube") ---------- */
  /* Custom properties scoped to #cubeStage (not :root) so they can't leak
     into or collide with the rest of the site's variables. */
  #cubeStage {
    --void: #000000;
    --halo: 214, 228, 255;      /* soft cool white, as rgb parts */
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --s: 180px;
    --bw: 5px;                  /* edge thickness */
    --r: 2px;                   /* corner radius of the blurred bloom */

    position: fixed;
    inset: 0;
    background: var(--void);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
  }

  #cubeStage #intro {
    position: absolute;
    inset: 0;
    z-index: 5;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: clamp(30px, 8.6vw, 60px);
    font-weight: 500;
    letter-spacing: -0.045em;
    color: #FFFFFF;
    transition: opacity 320ms ease, transform 520ms cubic-bezier(.4, 0, .2, 1);
    cursor: pointer;
  }
  /* Mobile-only escape hatch off the "Click me" landing — jumps straight to
     the six-tile field instead of making the visitor sit through the cube's
     drop/unfold reveal. Desktop is left alone since a mouse click on the
     intro text gets there almost as fast anyway. */
  #cubeStage .skip-menu-btn { display: none; }
  @media (max-width: 640px) {
    #cubeStage .skip-menu-btn {
      display: block;
      position: absolute;
      top: 24px;
      left: 20px;
      z-index: 10;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #FFFFFF;
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      transition: opacity 320ms ease;
    }
    #cubeStage .skip-menu-btn:active { border-color: #FFFFFF; }
    #cubeStage.started .skip-menu-btn { opacity: 0; pointer-events: none; }
  }
  #cubeStage.started #intro {
    opacity: 0;
    transform: scale(.97);
    pointer-events: none;
  }
  #cubeStage .blip { animation: cubeBlip 1.06s steps(1, end) infinite; }
  @keyframes cubeBlip { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }

  #cubeStage #scene {
    position: absolute;
    inset: 0;
    perspective: 1150px;
    perspective-origin: 50% 47%;
  }

  #cubeStage #drop {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transform: translateY(-125vh);
  }
  #cubeStage.dropped #drop {
    transform: translateY(0);
    /* 2s float down — decelerating, as if caught by the field it hovers in */
    transition: transform 2000ms cubic-bezier(.14, .8, .2, 1) 120ms;
  }

  #cubeStage #hover {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }
  #cubeStage.dropped #hover { animation: cubeHover 4.8s ease-in-out 2120ms infinite; }
  #cubeStage.flat #hover { animation: none; }

  /* starts at rest so it picks up the drop without a jump */
  @keyframes cubeHover {
    0%   { transform: translateY(0); }
    50%  { transform: translateY(calc(var(--s) * -.085)); }
    100% { transform: translateY(0); }
  }

  #cubeStage #net {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--s);
    height: var(--s);
    margin-left: calc(var(--s) / -2);
    margin-top: calc(var(--s) / -2);
    transform-style: preserve-3d;
  }

  #cubeStage #cube {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    will-change: transform;
  }

  #cubeStage .hinge {
    position: absolute;
    width: var(--s);
    height: var(--s);
    transform-style: preserve-3d;
  }
  /* assembled: each flap folded 90deg away from the front plane */
  #cubeStage .h-right  { left: var(--s);            top: 0;                    transform-origin: 0 50%;    transform: rotateY(90deg); }
  #cubeStage .h-left   { left: calc(var(--s) * -1); top: 0;                    transform-origin: 100% 50%; transform: rotateY(-90deg); }
  #cubeStage .h-top    { left: 0;                   top: calc(var(--s) * -1);  transform-origin: 50% 100%; transform: rotateX(90deg); }
  #cubeStage .h-bottom { left: 0;                   top: var(--s);             transform-origin: 50% 0;    transform: rotateX(-90deg); }
  #cubeStage .h-back   { left: 0;                   top: var(--s);             transform-origin: 50% 0;    transform: rotateX(-90deg); }

  /* unfolded: every hinge flattens into the net */
  #cubeStage.flat .hinge {
    transform: rotateY(0deg) rotateX(0deg);
    transition: transform 660ms cubic-bezier(.32, .7, .18, 1);
  }
  #cubeStage.flat .h-right  { transition-delay: 520ms; }
  #cubeStage.flat .h-left   { transition-delay: 670ms; }
  #cubeStage.flat .h-top    { transition-delay: 820ms; }
  #cubeStage.flat .h-bottom { transition-delay: 970ms; }
  #cubeStage.flat .h-back   { transition-delay: 1120ms; }

  /* ---------- edges ---------- */
  /* The outline is a border drawn INSIDE each face, so no part of it ever
     crosses that face's own boundary. Two neighbouring faces each lay a strip
     along the edge they share, meeting at right angles like the inside of a
     folded box, and at a vertex the three corner squares close it outright.
     The sub-pixel blur is antialiasing: 3D-transformed layers rasterise
     without it, and those bare stair-steps read as jagged. */

  #cubeStage .face, #cubeStage .cube-tile {
    position: absolute;
    background: rgba(var(--halo), .02);
  }
  #cubeStage .face { inset: 0; }

  #cubeStage .wire {
    position: absolute;
    inset: 0;
    border: var(--bw) solid #FFFFFF;
    filter: blur(.7px);
  }

  /* two blurred blooms trace the same outline — no box-shadow anywhere, so the
     falloff stays round and continuous instead of banding into a hard halo */
  #cubeStage .face::before, #cubeStage .cube-tile::before,
  #cubeStage .face::after,  #cubeStage .cube-tile::after {
    content: "";
    position: absolute;
    pointer-events: none;
  }
  #cubeStage .face::before, #cubeStage .cube-tile::before {
    inset: -2px;
    border: calc(var(--bw) + 1px) solid rgba(255, 255, 255, .8);
    border-radius: var(--r);
    filter: blur(7px);
  }
  #cubeStage .face::after, #cubeStage .cube-tile::after {
    inset: -7px;
    border: calc(var(--bw) + 5px) solid rgba(var(--halo), .5);
    border-radius: calc(var(--r) + 5px);
    filter: blur(21px);
  }

  /* ---------- direction hint ---------- */

  #cubeStage #cubeHint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: max(30px, env(safe-area-inset-bottom, 0px));
    margin: 0;
    text-align: center;
    font-family: var(--mono);
    font-size: 33px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, .34);
    opacity: 0;
    transition: opacity 700ms ease;
    pointer-events: none;
  }
  #cubeStage.hinting #cubeHint { opacity: 1; }
  @media (max-width: 640px) {
    /* Keep the cube instruction readable without competing with the cube on a
       phone. Desktop retains its original display size. */
    #cubeStage #cubeHint { font-size: clamp(16px, 5vw, 20px); letter-spacing: .1em; }
  }

  /* ---------- tile field ---------- */

  #cubeStage #panels {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  #cubeStage .cube-tile {
    will-change: left, top, width, height;
    display: grid;
    place-items: center;
    overflow: hidden;
    cursor: pointer;
    color: #fff;
    border-color: currentColor;
    /* Begin as the same cool-black material as a cube face. The colour accent
       is reserved for hover, so the face-to-rectangle handoff never flashes. */
    background: rgba(var(--halo), .02);
    transition: color .22s ease, background .22s ease, opacity .42s ease;
  }
  #cubeStage.field #panels { pointer-events: auto; }
  #cubeStage .cube-tile .tile-title, #cubeStage .cube-tile .tile-copy {
    position: absolute;
    max-width: 78%;
    text-align: center;
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: .12em;
    transition: opacity .65s ease, transform .28s ease;
  }
  #cubeStage .cube-tile .tile-title { font-size: clamp(26px, 3.6vw, 44px); color: #fff; opacity: 0; }
  #cubeStage .idea-loading-dots { display: inline-flex; width: 1.9em; letter-spacing: 0; white-space: nowrap; }
  #cubeStage .idea-loading-dots i { width: .63em; font: inherit; font-style: normal; opacity: 0; }
  #cubeStage .idea-loading-dots i:nth-child(1) { animation: cube-loading-dot-one 1.8s linear infinite; }
  #cubeStage .idea-loading-dots i:nth-child(2) { animation: cube-loading-dot-two 1.8s linear infinite; }
  #cubeStage .idea-loading-dots i:nth-child(3) { animation: cube-loading-dot-three 1.8s linear infinite; }
  @keyframes cube-loading-dot-one { 0%, 9%, 80%, 100% { opacity: 0; } 10%, 79% { opacity: 1; } }
  @keyframes cube-loading-dot-two { 0%, 31%, 80%, 100% { opacity: 0; } 32%, 79% { opacity: 1; } }
  @keyframes cube-loading-dot-three { 0%, 53%, 80%, 100% { opacity: 0; } 54%, 79% { opacity: 1; } }
  @media (max-width: 640px) {
    /* Mobile tiles are two columns wide; keep the Snowboarder Demo title
       wholly inside its rectangle. */
    #cubeStage .cube-tile .tile-title {
      max-width: 92%;
      font-size: clamp(14px, 3.8vw, 18px);
      letter-spacing: .05em;
      white-space: nowrap;
      overflow-wrap: normal;
    }
  }
  #cubeStage .cube-tile .tile-copy { font-size: clamp(10px, 1.15vw, 14px); line-height: 1.55; color: #fff; opacity: 0; transform: translateY(8px); text-transform: none; letter-spacing: .04em; }
  #cubeStage.field .cube-tile .tile-title { opacity: 1; transition-duration: 1.25s; }
  #cubeStage .cube-tile:hover { color: var(--tile, #fff); }
  #cubeStage .cube-tile:hover .wire { border-color: currentColor; }
  #cubeStage .cube-tile.has-copy:hover { background: color-mix(in srgb, currentColor 13%, #000); }
  #cubeStage .cube-tile.has-copy:hover .tile-title { opacity: 0; transform: none; transition: none; }
  #cubeStage .cube-tile.has-copy:hover .tile-copy { opacity: 1; transform: none; transition: none; }
  /* Keep the neutral cube bloom while tiles are travelling. Accent colour only
     appears after a deliberate hover, matching the white cube wireframe. */
  #cubeStage .cube-tile:hover::before, #cubeStage .cube-tile:hover::after { border-color: currentColor; }
  #cubeStage .cube-tile.selecting { z-index: 5; }
  #cubeStage #cubeMessage {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 12vw;
    color: #fff; font-family: var(--mono); font-size: clamp(20px, 4vw, 52px);
    line-height: 1.2; letter-spacing: .04em; text-align: center; pointer-events: none;
  }
  #cubeStage #cubeCountdown { position: absolute; left: 50%; top: calc(50% + 1.25em); transform: translateX(-50%); color: #fff; font: inherit; font-size: 1em; letter-spacing: .04em; }
  @media (max-width: 640px) {
    /* The Idea Loading sentence wraps to three lines on a phone. Keep the
       countdown beneath that block rather than on top of “returning home”. */
    #cubeStage #cubeCountdown { top: calc(50% + 3.6em); }
  }
  #cubeStage.interactive .cube-tile.has-copy .tile-title, #cubeStage.interactive .cube-tile.has-copy .tile-copy { transition: none !important; }

  #view-contact.cube-contact { background: #000; color: #fff; }
  #view-contact.cube-contact .frame { border-color: rgba(255,255,255,.22); }
  #view-contact.cube-contact .content { color: #fff; }
  #view-contact.cube-contact input, #view-contact.cube-contact textarea { background: #050505; color: #fff; border-color: rgba(98, 232, 153, .72); }
  #view-contact.cube-contact button#sendBtn { background: #62e899; color: #000; }
  #view-contact.cube-contact .contact-heading, #view-contact.cube-contact .send-note { color: #62e899; }
  .cube-home { position: fixed; top: 18px; left: 18px; z-index: 80; color: #fff; font: 600 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; text-decoration: none; padding: 10px 12px; border: 1px solid rgba(255,255,255,.7); background: rgba(0,0,0,.36); }
  .cube-home:hover { background: #fff; color: #000; }
  }

  /* Keeps the hamburger icon visible against the cube view's black
     background — its bars are var(--ink), tuned for the paper background
     every other view sits on. */
  body.dark-chrome .menu-btn span { background: #fff; }
</style>
</head>

<!-- CUBE ("dangcube") -->
<div class="view panel-view" id="view-cube">
  <div id="cubeStage">
    <button class="skip-menu-btn" id="skipMenuBtn" type="button">Skip to menu</button>
    <p id="intro" onclick="window.__cubeReveal && window.__cubeReveal()">Click me<span>.</span><span>.</span><span class="blip">.</span></p>

    <div id="scene">
      <div id="drop">
        <div id="hover">
          <div id="net">
            <div id="cube">
              <div class="face f-front"></div>
              <div class="hinge h-right"><div class="face f-right"></div></div>
              <div class="hinge h-left"><div class="face f-left"></div></div>
              <div class="hinge h-top"><div class="face f-top"></div></div>
              <div class="hinge h-bottom">
                <div class="face f-bottom"></div>
                <div class="hinge h-back"><div class="face f-back"></div></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <p id="cubeHint">drag any direction to turn &middot; tap the cube</p>

    <div id="panels"></div>
  </div>
</div>

<script>
  (() => {
    const stage = document.getElementById('cubeStage');
    const cube = document.getElementById('cube');
    const net = document.getElementById('net');
    const drop = document.getElementById('drop');
    const panels = document.getElementById('panels');

    const TILT = -15;      // opening pitch — keeps the top face slightly in view
    const YAW_IDLE = 52;   // resting drift about the vertical axis, deg/sec
    const PITCH_IDLE = -44;// resting drift about the horizontal axis, deg/sec
    const ENTRY = 300;     // it comes in spinning fast and winds down to idle
    const DAMP = 0.62;     // viscous drag, per second — lower = longer glide
    const MAX_W = 1500;    // deg/sec ceiling on a flick
    const WINDOW = 110;    // ms of pointer history the flick is measured over
    const AXIS_LOCK = 7;   // px of travel before a gesture commits to an axis
    const CUBE_T = 'cubic-bezier(.32,.7,.18,1)';
    const M = 8, G = 8;    // panel field margin + gutter

    const WIRE = '<i class="wire"></i>';
    stage.querySelectorAll('.face').forEach(f => { f.innerHTML = WIRE; });

    let S = 180;
    let state = 'intro';   // intro -> cube -> unfolding -> field
    let raf = 0, lastT = 0;
    let fieldTiles = [];

    // Two turntables sharing the cube's centroid: yaw about the vertical axis,
    // pitch about the horizontal one. Only ever one of them is live — whichever
    // the user last dragged. The other holds the angle it was left at.
    //   a = angle in deg, w = angular velocity in deg/sec, idle = resting drift
    const AX = {
      yaw:   { a: 24,   w: YAW_IDLE, idle: YAW_IDLE },
      pitch: { a: TILT, w: 0,        idle: PITCH_IDLE }
    };
    let live = 'yaw';
    let timers = [];

    const after = (ms, fn) => timers.push(setTimeout(fn, ms));
    const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

    function sizeCube() {
      S = Math.round(Math.min(Math.min(innerWidth, innerHeight) * 0.42, 220));
      stage.style.setProperty('--s', S + 'px');
    }

    // #cube is the front face, so the solid hangs BEHIND it, spanning z = -S..0
    // with its centre at -S/2. translateZ runs first (it is rightmost) and lifts
    // that centre onto the origin, so BOTH turns afterwards are about the
    // centroid — each axis stays dead down the middle of the cube.
    function paint() {
      cube.style.transform =
        `rotateX(${AX.pitch.a}deg) rotateY(${AX.yaw.a}deg) translateZ(${S / 2}px)`;
    }

    /* ---------- motion: angular velocity under viscous drag ---------- */

    function tick(t) {
      const dt = Math.min((t - lastT) / 1000, 0.05);
      lastT = t;
      if (!drag.active) {
        // only the live axis integrates; the frozen one keeps its angle and its
        // zeroed velocity, so it stays exactly where the user left it.
        // exponential decay toward the resting drift — a hard flick keeps
        // spinning for seconds, a gentle nudge bleeds off almost at once
        const ax = AX[live];
        ax.w += (ax.idle - ax.w) * (1 - Math.exp(-DAMP * dt));
        ax.a += ax.w * dt;
      }
      paint();
      raf = requestAnimationFrame(tick);
    }

    function startSpin() {
      if (raf) return;
      lastT = performance.now();
      raf = requestAnimationFrame(tick);
    }
    function stopSpin() { cancelAnimationFrame(raf); raf = 0; }

    /* ---------- pointer ---------- */

    const drag = { active: false, x: 0, y: 0, sx: 0, sy: 0, moved: 0, axis: null };
    let history = [];   // {t, a} on the live axis — measures the release velocity

    function sample(t) {
      history.push({ t, a: AX[live].a });
      while (history.length > 2 && t - history[0].t > WINDOW) history.shift();
    }

    // velocity across the sampling window, not the last frame — a finger that
    // slows to a stop before lifting releases at rest, which is what it should do
    function releaseVelocity() {
      if (history.length < 2) return 0;
      const a = history[0], b = history[history.length - 1];
      const dt = (b.t - a.t) / 1000;
      if (dt < 0.008) return 0;
      return Math.max(-MAX_W, Math.min(MAX_W, (b.a - a.a) / dt));
    }

    // any way a gesture can end has to hand the spin back, or the cube freezes
    // for good waiting on a pointerup that is never coming
    function endDrag(t) {
      if (!drag.active) return;
      drag.active = false;
      sample(t);
      // the axis just dragged is the one that carries on turning; a release with
      // no flick behind it simply hands back that axis's resting drift
      AX[live].w = releaseVelocity() || AX[live].idle;
    }

    stage.addEventListener('pointerdown', e => {
      drag.sx = drag.x = e.clientX;
      drag.sy = drag.y = e.clientY;
      drag.moved = 0;
      drag.axis = null;
      history = [];
      if (state !== 'cube') return;
      try { stage.setPointerCapture(e.pointerId); } catch (_) { /* not fatal */ }
      drag.active = true;
      AX.yaw.w = AX.pitch.w = 0;   // both turntables stop dead under the finger
      sample(performance.now());
    });

    stage.addEventListener('pointermove', e => {
      const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
      if (!drag.active) return;

      // a gesture commits to whichever axis it opened along and keeps it: a drag
      // that wanders diagonally must not start bleeding into the frozen axis
      // halfway through. Committing also makes that axis the live one, which
      // freezes the other wherever it had got to.
      if (!drag.axis && drag.moved >= AXIS_LOCK) {
        drag.axis = Math.abs(dx) > Math.abs(dy) ? 'yaw' : 'pitch';
        live = drag.axis;
        history = [];
        sample(performance.now());
      }

      // drag right and the front face follows right; drag down and it follows
      // down, which tips the top toward you — hence the inverted sign on pitch
      if (drag.axis === 'yaw')   AX.yaw.a   += (e.clientX - drag.x) * 0.42;
      if (drag.axis === 'pitch') AX.pitch.a -= (e.clientY - drag.y) * 0.42;

      drag.x = e.clientX;
      drag.y = e.clientY;
      if (drag.axis) sample(performance.now());
      paint();
    });

    stage.addEventListener('pointerup', e => {
      endDrag(performance.now());
      if (drag.moved >= 10) return;

      if (state === 'intro') reveal();
      else if (state === 'cube' && overCube(e.clientX, e.clientY)) unfold();
    });

    stage.addEventListener('pointercancel', () => endDrag(performance.now()));
    stage.addEventListener('lostpointercapture', () => endDrag(performance.now()));

    // #net is the cube's static footprint; the spinning solid sweeps wider than
    // it, so the tap target is padded out to the swept silhouette
    function overCube(x, y) {
      const r = net.getBoundingClientRect();
      const pad = S * 0.35;
      return x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad;
    }

    /* ---------- act 1: it falls in spinning, and winds down into a hover ---------- */

    function reveal() {
      if (state !== 'intro') return;
      state = 'cube';
      live = 'yaw';
      AX.yaw.w = ENTRY;
      stage.classList.add('started', 'dropped');
      startSpin();
      // Start the fade as the cube begins dropping, so the direction prompt is
      // visible roughly three seconds earlier than the previous delayed cue.
      after(0, () => {
        if (state === 'cube') stage.classList.add('hinting');
      });
    }

    /* ---------- act 2: the cube unfolds into its net ---------- */

    function unfold() {
      state = 'unfolding';
      stopSpin();
      stage.classList.remove('hinting');

      // settle square to the camera on the nearest full turn of each axis, so it
      // takes the short way round however far either one has wound up
      const yaw = Math.round(AX.yaw.a / 360) * 360;
      const pitch = Math.round(AX.pitch.a / 360) * 360;
      AX.yaw.a = yaw;
      AX.pitch.a = pitch;
      cube.style.transition = `transform 660ms ${CUBE_T}`;
      cube.style.transform =
        `rotateX(${pitch}deg) rotateY(${yaw}deg) translateZ(${S / 2}px)`;

      // the flat net is 3 faces wide and 4 tall — scale it to fit, recentre it
      const k = Math.min(1, (innerHeight * 0.84) / (S * 4), (innerWidth * 0.92) / (S * 3));
      net.style.transition = `transform 1240ms ${CUBE_T} 520ms`;
      net.style.transform = `scale(${k}) translateY(-50%)`;

      stage.classList.add('flat');
      after(1860, toField);
    }

    /* ---------- act 3: the net becomes a field of light ---------- */

    const ORDER = ['.f-top', '.f-left', '.f-front', '.f-right', '.f-bottom', '.f-back'];

    function cellRect(i) {
      const portrait = innerHeight >= innerWidth;
      const cols = portrait ? 2 : 3;
      const rows = portrait ? 3 : 2;
      const w = (innerWidth - M * 2 - G * (cols - 1)) / cols;
      const h = (innerHeight - M * 2 - G * (rows - 1)) / rows;
      return {
        left: M + (i % cols) * (w + G),
        top: M + Math.floor(i / cols) * (h + G),
        width: w,
        height: h
      };
    }

    function place(el, r) {
      el.style.left = r.left + 'px';
      el.style.top = r.top + 'px';
      el.style.width = r.width + 'px';
      el.style.height = r.height + 'px';
    }

    function applyIdeaLoadingTitle(el, card) {
      if (card.type !== 'idea') return;
      const title = el.querySelector('.tile-title');
      if (!title) return;
      title.innerHTML = 'Idea loading<span class="idea-loading-dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span>';
    }

    function toField() {
      // read where each face actually sits on screen, then grow it into its cell
      const from = ORDER.map(sel => cube.querySelector(sel).getBoundingClientRect());

      drop.style.visibility = 'hidden';

      const cards = window.__cubeLandingCards || [];
      const tiles = from.map((r, i) => {
        const card = cards[i] || { title: 'Idea loading', color: '#ff4d4d', type: 'idea' };
        const el = document.createElement('div');
        el.className = `cube-tile${card.copy ? ' has-copy' : ''}`;
        el.style.setProperty('--tile', card.color);
        el.innerHTML = `${WIRE}<span class="tile-title">${card.title}</span>${card.copy ? `<span class="tile-copy">${card.copy}</span>` : ''}`;
        el.addEventListener('click', () => selectTile(el, card));
        place(el, r);
        panels.appendChild(el);
        applyIdeaLoadingTitle(el, card);
        return el;
      });
      fieldTiles = tiles;

      requestAnimationFrame(() => requestAnimationFrame(() => {
        tiles.forEach((el, i) => {
          el.style.transition = ['left', 'top', 'width', 'height']
            .map(p => `${p} 820ms cubic-bezier(.22,.9,.24,1) ${i * 110}ms`).join(', ');
          place(el, cellRect(i));
        });
      }));

      after(1420, () => {
        state = 'field';
        stage.classList.add('titled', 'field');
        after(750, () => stage.classList.add('interactive'));
      });
    }

    document.getElementById('intro').addEventListener('click', reveal);

    function selectTile(tile, card) {
      if (state !== 'field') return;
      state = 'selecting';
      stage.classList.remove('field');
      // Each unselected rectangle exits in sequence before the selected one
      // takes over the frame, echoing the portfolio's existing card transition.
      fieldTiles.forEach((other, i) => {
        if (other === tile) return;
        other.style.transition = `opacity 240ms ease ${i * 75}ms`;
        other.style.opacity = '0';
      });
      after(520, () => {
        tile.classList.add('selecting');
        tile.style.transition = 'left 520ms cubic-bezier(.22,.9,.24,1), top 520ms cubic-bezier(.22,.9,.24,1), width 520ms cubic-bezier(.22,.9,.24,1), height 520ms cubic-bezier(.22,.9,.24,1)';
        place(tile, { left: 0, top: 0, width: innerWidth, height: innerHeight });
        after(560, () => {
          if (card.type === 'idea') return showIdea();
          window.__openCubeLandingCard?.(card);
        });
      });
    }

    function showIdea() {
      const message = document.createElement('p');
      message.id = 'cubeMessage';
      message.innerHTML = '<span></span>';
      panels.appendChild(message);
      const text = 'Kevin has no idea what to put here yet .. returning home';
      let i = 0;
      const type = () => {
        message.firstElementChild.textContent = text.slice(0, ++i);
        if (i < text.length) after(36, type);
        else countdown();
      };
      type();
    }

    function countdown() {
      const count = document.createElement('span');
      count.id = 'cubeCountdown';
      document.getElementById('cubeMessage')?.appendChild(count);
      let n = 3;
      const tick = () => {
        count.textContent = n;
        if (n-- > 1) after(700, tick);
        else after(700, restoreField);
      };
      tick();
    }

    function restoreField() {
      panels.querySelector('#cubeMessage')?.remove();
      fieldTiles.forEach((tile, i) => {
        tile.classList.remove('selecting');
        tile.style.transition = `opacity 360ms ease ${i * 70}ms`;
        tile.style.opacity = '1';
        place(tile, cellRect(i));
      });
      state = 'field';
      stage.classList.add('field');
    }

    /* ---------- reset ---------- */

    function reset() {
      state = 'intro';
      clearTimers();
      stage.classList.remove('titled', 'field');
      stage.classList.remove('interactive');

      [...panels.children].forEach((el, i) => {
        el.style.transition = `opacity 420ms ease ${i * 45}ms`;
        el.style.opacity = '0';
      });

      after(720, () => {
        panels.textContent = '';
        stage.classList.remove('started', 'dropped', 'flat', 'hinting');
        drop.style.visibility = '';
        net.style.transition = 'none';
        net.style.transform = '';
        cube.style.transition = 'none';
        AX.yaw.a = 24;   AX.yaw.w = YAW_IDLE;
        AX.pitch.a = TILT; AX.pitch.w = 0;
        live = 'yaw';
        paint();
        requestAnimationFrame(() => { cube.style.transition = ''; });
      });
    }

    window.addEventListener('resize', () => {
      if (state === 'intro') { sizeCube(); paint(); return; }
      if (state !== 'field') return;
      [...panels.children].forEach((el, i) => place(el, cellRect(i)));
    });

    // Available immediately for the dedicated /home/ route. This code lives
    // inside the cube controller so it can use its private animation state.
    window.__cubeReturnToField = () => {
      if (state !== 'intro') return;
      state = 'field';
      // The direct Home route is the finished six-box page, not the cube
      // intro. Hide every intro-only cue so it matches the six-box screen.
      stage.querySelector('#intro').style.display = 'none';
      stage.querySelector('#cubeHint').style.display = 'none';
      drop.style.visibility = 'hidden';
      const cards = window.__cubeLandingCards || [];
      fieldTiles = cards.map((card, i) => {
        const el = document.createElement('div');
        el.className = `cube-tile${card.copy ? ' has-copy' : ''}`;
        el.style.setProperty('--tile', card.color);
        el.style.opacity = '0';
        el.innerHTML = `${WIRE}<span class="tile-title">${card.title}</span>${card.copy ? `<span class="tile-copy">${card.copy}</span>` : ''}`;
        el.addEventListener('click', () => selectTile(el, card));
        place(el, cellRect(i));
        panels.appendChild(el);
        applyIdeaLoadingTitle(el, card);
        return el;
      });
      stage.classList.add('titled', 'field');
      requestAnimationFrame(() => fieldTiles.forEach((el, i) => {
        el.style.transition = `opacity 650ms ease ${i * 90}ms`;
        el.style.opacity = '1';
      }));
      after(750, () => stage.classList.add('interactive'));
    };
    window.__cubeReveal = () => {
      if (state === 'intro') reveal();
    };

    // "Skip to menu" tap target sits on top of the intro/cube pointer
    // handlers above — stop every pointer event from bubbling to `stage` so
    // tapping it can never also be read as the tap-the-cube gesture.
    const skipBtn = document.getElementById('skipMenuBtn');
    if (skipBtn) {
      ['pointerdown', 'pointermove', 'pointerup', 'click'].forEach(type => {
        skipBtn.addEventListener(type, e => e.stopPropagation());
      });
      skipBtn.addEventListener('click', () => {
        skipBtn.style.display = 'none';
        window.__cubeReturnToField();
      });
    }

    sizeCube();
    paint();
  })();
</script>

  function routeFromPath() {
    // A direct file:// preview has the Windows file path as pathname; treat it

    let slug = location.protocol === 'file:'
      ? ''

  let scrollAnimationToken = 0;
  function cancelSmoothScroll() {

    const target = document.getElementById('view-' + id);
    target.classList.add('active');
    // Always starts at its own top — meaningful for panel-views (their own
    // independent scrollTop) and harmless for #view-home (not independently
    // scrollable, so this is a no-op there).
    target.scrollTop = 0;
    if (crossfade) {
      // Mount invisibly; the caller will trigger the fade-in for a true,
      // overlapping crossfade.
      target.classList.add('prefade');
    } else {
      // Normal navigation: play the entrance animation.
      void target.offsetWidth;
      target.classList.add('entering');
    }
    const menuBtn = document.getElementById('menuBtn');
    if (id === 'home') {
      menuBtn.classList.remove('visible');
      menuBtn.style.opacity = '';
      menuBtn.style.pointerEvents = '';
    } else {
      menuBtn.style.opacity = '';
      menuBtn.style.pointerEvents = '';
      menuBtn.classList.add('visible');
    }
    // The cube view is full-bleed black, unlike every other view's paper
    // background — the hamburger bars need to flip light to stay visible on it.
    document.body.classList.toggle('dark-chrome', id === 'cube' || id === 'contact');
    document.getElementById('view-contact')?.classList.toggle('cube-contact', id === 'contact');
    // Panel-views are always fixed/self-scrolling, so this only actually
    // matters when landing back on #view-home.
    if (!crossfade) window.scrollTo(0, 0);
    closeMenu();
    return target;
  }

  function goHome() {
    showView('cube');
    setPath('/');
  }

  function goExplore() {
    // No showView() here — clicking the hero only ever happens while the
    // home view is already active, so re-triggering it would just replay
    // the view's entrance animation (a visible flash) before the scroll.
    const el = document.getElementById('exploreSection');
    const target = el.getBoundingClientRect().top + window.scrollY;
    smoothScrollTo(target);
  }

  // Shatter effect for "Curious about me?" — built once, then scrubbed
  // directly by scroll position (see updateShatter/the scroll listener below)
  // instead of playing as a fixed-length animation. That means it dissolves
  // as you scroll down and reassembles as you scroll back up, freezing at
  // whatever partial state matches wherever you stop.
  let shardEls = [];

  function buildShardContainer() {
    const questionEl = document.getElementById('question');
    const questionWrap = document.getElementById('questionWrap');
    if (!questionEl || !questionWrap) return;

    // .shatter-container is position:absolute; inset:0 inside .question-wrap
    // (which shrink-wraps the real heading via normal CSS layout), so it
    // always exactly matches the heading's box — no JS-measured pixel values
    // to keep in sync as fonts load or the window resizes.
    const container = document.createElement('div');
    container.className = 'shatter-container';

    const rows = 3, cols = 3;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const shard = document.createElement('div');
        shard.className = 'shatter-shard';
        const top = (r / rows) * 100, bottom = 100 - ((r + 1) / rows) * 100;
        const left = (c / cols) * 100, right = 100 - ((c + 1) / cols) * 100;
        shard.style.clipPath = `inset(${top}% ${right}% ${bottom}% ${left}%)`;
        // Direction this shard flies outward in at full progress — based on
        // where its cell sits relative to the center, like debris from an
        // impact in the middle (a corner piece flies toward its corner, a top
        // piece flies up, etc.), so pieces disperse a full 360° around the
        // center rather than in one biased direction.
        const cx = (c + 0.5) / cols - 0.5;
        const cy = (r + 0.5) / rows - 0.5;
        const angle = (cx === 0 && cy === 0)
          ? Math.random() * Math.PI * 2
          : Math.atan2(cy, cx) + (Math.random() - 0.5) * 0.9;
        const distance = 90 + Math.random() * 100;
        shard._dx = Math.cos(angle) * distance;
        shard._dy = Math.sin(angle) * distance;
        shard._rot = (Math.random() - 0.5) * 70;
        // The clone keeps its own natural block layout (untouched) so its
        // internal <br> line-break still renders exactly like the original —
        // flexbox doesn't respect <br> the same way, which was distorting it.
        // Centering happens on the shard itself instead.
        const clone = questionEl.cloneNode(true);
        shard.appendChild(clone);
        container.appendChild(shard);
        shardEls.push(shard);
      }
    }

    // At progress 0 the shards sit assembled with opacity 1, pixel-identical
    // to the real heading, so swapping to them right away is invisible.
    questionEl.style.visibility = 'hidden';
    questionWrap.appendChild(container);
  }

  // progress: 0 = fully assembled (looks like normal text), 1 = fully
  // dispersed/invisible. Called on every scroll tick with the live value.
  function updateShatter(progress) {
    shardEls.forEach(shard => {
      shard.style.transform = `translate(${shard._dx * progress}px, ${shard._dy * progress}px) rotate(${shard._rot * progress}deg)`;
      shard.style.opacity = String(1 - progress);
    });
    // Clear the inline override at rest (progress 0) instead of forcing
    // opacity:1 — the hint label's own CSS baseline is 0.85, not 1.
    document.querySelectorAll('#heroSection .hero-frame, #heroSection .hint').forEach(el => {
      el.style.opacity = progress <= 0 ? '' : String(1 - progress);
    });
  }

  function jumpToExplore() {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-home').classList.add('active');
    document.body.classList.remove('dark-chrome');
    closeMenu();
    setPath('/home');
    requestAnimationFrame(() => {
      const el = document.getElementById('exploreSection');
      el.scrollIntoView({ behavior: 'auto', block: 'start' });
      document.getElementById('menuBtn').classList.add('visible');
    });
  }

  function makeBox(i, title, tag, note, onClick, img, color) {
    const box = document.createElement('div');
    box.className = 'box';
    const photo = img
      ? `<div class="photo" style="background-image:url('${img}');background-size:cover;background-position:center;"></div>`
      : `<div class="photo" style="background:${color || gradients[i % gradients.length]}"></div>`;
    box.innerHTML = `${photo}
      <div class="veil"></div>
      <div class="label">${tag ? `<span class="index">${tag}</span>` : ''}<span class="title">${title}</span>${note ? `<span class="note">${note}</span>` : ''}</div>`;
    box.addEventListener('click', () => zoomIntoCard(box, onClick));
    attachTilt(box);
    return box;
  }

  // Mouse-tracking 3D tilt — only wired up on devices with a real cursor.
  const supportsHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  function attachTilt(box) {
    if (!supportsHover) return;
    const MAX = 9; // max degrees of tilt
    box.addEventListener('mousemove', (e) => {
      if (box.classList.contains('zooming') || box.classList.contains('isolated-card')) return;
      const r = box.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;   // 0..1 across
      const py = (e.clientY - r.top) / r.height;   // 0..1 down
      // cursor right -> rotateY positive (right edge toward viewer)
      // cursor up    -> rotateX positive (top edge toward viewer)
      const tiltY = (px - 0.5) * 2 * MAX;
      const tiltX = -(py - 0.5) * 2 * MAX;
      box.style.setProperty('--tiltY', tiltY.toFixed(2) + 'deg');
      box.style.setProperty('--tiltX', tiltX.toFixed(2) + 'deg');
      box.classList.add('tilting');
    });
    box.addEventListener('mouseleave', () => {
      box.classList.remove('tilting');
      box.style.removeProperty('--tiltX');
      box.style.removeProperty('--tiltY');
    });
  }

  // Phase 1: fade everything except the tapped card. Phase 2: zoom the card into the next page.
  function zoomIntoCard(box, done) {
    // Kill any in-flight scroll animation the instant a card is tapped — e.g.
    // the hero-to-grid auto-scroll, if this tap happens before it's finished.
    // Left running, it would keep calling scrollTo on every frame for its
    // full remaining duration, fighting the scroll reset later in this
    // sequence and landing on the wrong part of the next page.
    cancelSmoothScroll();

    const grid = box.parentElement;
    const view = box.closest('.view');
    const menuBtn = document.getElementById('menuBtn');

    // Phase 1 — isolate the card
    box.classList.add('isolated-card');
    grid.classList.add('isolating');
    if (view) view.classList.add('isolating');
    menuBtn.classList.add('fading');

    setTimeout(() => {
      // Phase 2 — zoom the now-isolated card

      // Use the visual viewport for mobile-accurate centering. On phones this
      // reflects the actual visible area (excluding the browser toolbar / notch),
      // so the card lands truly centered rather than offset behind the UI chrome.
      const vv = window.visualViewport;
      const vpWidth = vv ? vv.width : window.innerWidth;
      const vpHeight = vv ? vv.height : window.innerHeight;
      const vpOffsetX = vv ? vv.offsetLeft : 0;
      const vpOffsetY = vv ? vv.offsetTop : 0;

      const rect = box.getBoundingClientRect();
      const cardCX = rect.left + rect.width / 2;
      const cardCY = rect.top + rect.height / 2;

      // Target = center of the *visible* viewport
      const targetCX = vpOffsetX + vpWidth / 2;
      const targetCY = vpOffsetY + vpHeight / 2;

      const dx = targetCX - cardCX;
      const dy = targetCY - cardCY;
      const scale = Math.max(vpWidth / rect.width, vpHeight / rect.height) * 1.15;

      box.classList.add('zooming');
      void box.offsetWidth;
      box.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
      box.style.opacity = '0';

      let nextView = null;

      // TRUE CROSSFADE: partway through the 0.5s zoom, mount the next page as a
      // fixed overlay (prefade) above the still-visible outgoing view, then fade
      // it in — so the incoming page is actually on screen dissolving over the
      // still-zooming card, not just appearing after it's gone.
      setTimeout(() => {
        nextView = done(true); // mounts the page in prefade (opacity 0), overlaying the outgoing view
        if (nextView) {
          // Let the opacity:0 state actually paint for one frame, then on the
          // next frame flip to crossfading so the transition registers cleanly.
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              nextView.classList.remove('prefade');
              nextView.classList.add('crossfading');
            });
          });
        }
      }, 200);

      // Clean up the card after the crossfade completes.
      setTimeout(() => {
        box.classList.remove('zooming');
        box.classList.remove('isolated-card');
        box.style.transform = '';
        box.style.opacity = '';
        grid.classList.remove('isolating');
        if (view) view.classList.remove('isolating');
        menuBtn.classList.remove('fading');
        // Settle the incoming view. It's a fixed, independently-scrolling
        // panel the whole time it's active (see .panel-view.active), so
        // there's no document-scroll position to fight here — it can only
        // ever show its own top. 'settled' converts from 'crossfading' in
        // one step: it also carries opacity:1 + animation:none, so the page
        // never falls back to the base .view fadeIn (which would otherwise
        // replay and cause a second flash).
        if (nextView) {
          nextView.classList.add('settled');
          nextView.classList.remove('crossfading');
        }
        // Only now hide the outgoing view — it's been visible underneath
        // the incoming one this whole time to make the crossfade a true
        // overlap.
        if (view && view !== nextView) view.classList.remove('active');
      }, 700);
    }, 360);
  }

  // Single source of truth for "open this topic card" — used by both the
  // home grid and the hamburger menu's topic list, so a topic with custom
  // behavior (like dangcube's cube view) stays consistent between them.
  function openTopic(key, crossfade) {
    if (key === 'dangcube') {
      setPath('/dangcube');
      return showView('cube', crossfade);
    }
    // Topics that hand off to a standalone page instead of an internal view.
    // The card's own zoom has already played by the time we get here, so we
    // only need to carry the screen to black — the destination fades up from
    // black on its own, which keeps it reading as one continuous move rather
    // than a page load.
    const t = topics[key];
    if (t && t.href) return leaveTo(t.href);
    return goToTopic(key, crossfade);
  }

  function leaveTo(href) {
    const veil = document.createElement('div');
    veil.style.cssText =
      'position:fixed;inset:0;background:#000;opacity:0;z-index:9999;' +
      'pointer-events:none;transition:opacity .42s ease';
    document.body.appendChild(veil);
    requestAnimationFrame(() => { veil.style.opacity = '1'; });
    setTimeout(() => { location.href = href; }, 430);
  }

  function buildExploreGrid() {
    const grid = document.getElementById('exploreGrid');
    grid.innerHTML = '';
    const keys = Object.keys(topics);
    keys.forEach((key, i) => {
      const t = topics[key];
      const box = makeBox(i, t.title, '', '', (cf) => openTopic(key, cf), null, t.color);
      if (i === keys.length - 1 && keys.length % 2 === 1) box.classList.add('last');
      grid.appendChild(box);
    });
  }

  function goToTopic(key, crossfade) {
    const t = topics[key];
    if (t.sub.length === 0) {
      return showDetail(key, null, t.title, 'This section is still being written.', crossfade);
    }
    currentTopic = key;
    document.getElementById('subgridTitle').textContent = t.title;
    document.getElementById('subgridSub').textContent = '';
    const box = document.getElementById('subgridBoxes');
    box.innerHTML = '';
    t.sub.forEach((s, i) => {
      const b = makeBox(i, s.title, s.tag, s.note, (cf) => showDetail(key, s.id, s.title, '', cf), s.img);
      if (i === t.sub.length - 1 && t.sub.length % 2 === 1) b.classList.add('last');
      box.appendChild(b);
    });
    setPath('/' + key);
    return showView('subgrid', crossfade);
  }

  function showDetail(topicKey, subId, title, fallbackLede, crossfade) {
    const t = topics[topicKey];
    document.getElementById('detailTitle').textContent = title;
    document.getElementById('detailLede').textContent = fallbackLede || `Placeholder copy for "${title}" — this is where your real writing goes.`;
    const crumb = document.getElementById('detailCrumb');
    if (t.sub.length) {
      crumb.textContent = '← ' + t.title;
      crumb.onclick = () => goToTopic(topicKey);
    } else {
      crumb.textContent = '← HOME';
      crumb.onclick = jumpToExplore;
    }
    setPath('/' + slugForDetail(topicKey, subId));
    return showView('detail', crossfade);
  }

  function buildPanelNav() {
    const nav = document.getElementById('panelNav');
    nav.innerHTML = '';
    const home = document.createElement('a');
    home.className = 'home';
    home.textContent = 'Home';
    home.addEventListener('click', goHome);
    nav.appendChild(home);
    const divider = document.createElement('div');
    divider.className = 'divider';
    nav.appendChild(divider);
    Object.keys(topics).forEach(key => {
      const a = document.createElement('a');
      a.textContent = topics[key].title;
      a.addEventListener('click', () => openTopic(key));
      nav.appendChild(a);
    });
  }

  function closeMenu() {
    document.getElementById('panel').classList.remove('show');
    document.getElementById('scrim').classList.remove('show');
    document.getElementById('menuBtn').classList.remove('open');
  }

  function toggleMenu() {
    const isOpen = document.getElementById('panel').classList.toggle('show');
    document.getElementById('scrim').classList.toggle('show', isOpen);
    document.getElementById('menuBtn').classList.toggle('open', isOpen);
  }

  document.getElementById('menuBtn').addEventListener('click', toggleMenu);
  document.getElementById('scrim').addEventListener('click', closeMenu);
  document.querySelectorAll('[data-goto]').forEach(el => {
    el.addEventListener('click', () => {
      const g = el.dataset.goto;
      if (g === 'hero') goHome();
      else if (g === 'explore') jumpToExplore();
      else { showView(g); setPath('/' + g); }
    });
  });

  document.getElementById('heroSection').addEventListener('click', goExplore);
  document.getElementById('subgridCrumb').addEventListener('click', jumpToExplore);

  function updateClock() {
    const now = new Date();
    const el = document.getElementById('clock');
    if (el) el.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  updateClock();
  setInterval(updateClock, 30000);

  // DVD-logo style bounce for the "Click me" hint
  (function () {
    const hero = document.getElementById('heroSection');
    const hint = document.getElementById('hint');
    let x = 60, y = 60;
    const speed = 5;
    let vx = speed, vy = speed * 0.7;

    function bounce() {
      const bounds = hero.getBoundingClientRect();
      const w = hint.offsetWidth;
      const h = hint.offsetHeight;
      const maxX = bounds.width - w;
      const maxY = bounds.height - h;

      x += vx;
      y += vy;

      if (x <= 0) { x = 0; vx = Math.abs(vx); }
      if (x >= maxX) { x = maxX; vx = -Math.abs(vx); }
      if (y <= 0) { y = 0; vy = Math.abs(vy); }
      if (y >= maxY) { y = maxY; vy = -Math.abs(vy); }

      hint.style.transform = `translate3d(${Math.round(x)}px, ${Math.round(y)}px, 0)`;
      requestAnimationFrame(bounce);
    }

    requestAnimationFrame(bounce);
  })();

  // Restore a deep-linked path saved by 404.html (GitHub Pages has no
  // server-side routing, so a direct request to e.g. /hobbies 404s there
  // first — see that file), then resolve whatever the URL now points to.
  (function restoreDeepLink() {
    const saved = sessionStorage.redirectPath;
    if (saved) {
      delete sessionStorage.redirectPath;
      if (saved !== '/') history.replaceState({}, '', saved);
    }
  })();

  buildExploreGrid();
  buildPanelNav();
  buildShardContainer();
  routeFromPath();
  if (new URLSearchParams(location.search).get('view') === 'home') {
    // /home/ is a real static entry point. It lands here with this explicit
    // view flag, bypassing Click me and rendering the six boxes immediately.
    setTimeout(() => window.__cubeReturnToField?.(), 0);
  }
  window.addEventListener('popstate', routeFromPath);

  // Fade the hamburger in, and shatter the heading, as the home page scrolls
  // from hero toward the grid — both driven directly by scroll position, so
  // scrolling back up reverses them exactly, stopping wherever you stop.
  window.addEventListener('scroll', () => {
    if (!document.getElementById('view-home').classList.contains('active')) return;
    const heroHeight = document.getElementById('heroSection').offsetHeight;
    const progress = Math.min(Math.max(window.scrollY / (heroHeight * 0.6), 0), 1);
    const menuBtn = document.getElementById('menuBtn');
    menuBtn.style.opacity = progress;
    menuBtn.style.pointerEvents = progress > 0.1 ? 'auto' : 'none';
    const shatterProgress = Math.min(Math.max(window.scrollY / (heroHeight * 0.4), 0), 1);
    updateShatter(shatterProgress);
  });

  // Contact form — posts directly to your Google Sheet
  const SHEET_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwSx6VPO9aUZkiTk7qWOFWnKvFYAoLKQlGSOv1ZdCI8YlnDNtEdk-bh20ipGH-NWKN0bg/exec';
  const YOUR_EMAIL = 'kevinxdang00@gmail.com';

  document.getElementById('sendBtn').addEventListener('click', async () => {
    const name = document.getElementById('nameBox').value.trim();
    const msg = document.getElementById('messageBox').value.trim();
    const note = document.getElementById('sendNote');
    const btn = document.getElementById('sendBtn');

    if (!msg) {
      note.textContent = 'You forgot your message, silly you.';
      return;
    }

    btn.disabled = true;
    note.textContent = 'Sending…';

    try {
      await fetch(SHEET_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ name: name, message: msg })
      });
      note.textContent = 'Appreciate the message.';
      document.getElementById('nameBox').value = '';
      document.getElementById('messageBox').value = '';
    } catch (err) {
      note.textContent = 'Something went wrong. Please try again.';
    } finally {
      btn.disabled = false;
    }
  });

  // Gmail icon — copy email to clipboard with toast feedback
  const gmailIcon = document.getElementById('gmailIcon');
  const copiedToast = document.getElementById('copiedToast');
  let toastTimer = null;
  gmailIcon.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(YOUR_EMAIL);
    } catch (e) {
      // Fallback for older browsers
      const tmp = document.createElement('textarea');
      tmp.value = YOUR_EMAIL;
      document.body.appendChild(tmp);
      tmp.select();
      document.execCommand('copy');
      document.body.removeChild(tmp);
    }
    copiedToast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => copiedToast.classList.remove('show'), 1800);
  });
</script>

</body>
