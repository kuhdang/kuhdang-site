<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Snowrider</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0b0f1a; overflow: hidden; }
      canvas { display: block; }
      body, #start-screen, #hint, #hud, #quality, #loading, #portfolio-home {
        font-family: 'Space Mono', monospace !important;
      }
      #portfolio-home {
        position: fixed;
        z-index: 30;
        top: 18px;
        left: 18px;
        color: #fff;
        font: 600 11px/1 'Space Mono', ui-monospace, monospace;
        letter-spacing: .16em;
        text-transform: uppercase;
        text-decoration: none;
        padding: 10px 12px;
        border: 1px solid rgba(255,255,255,.7);
        background: rgba(0,0,0,.36);
        transition: background .2s, color .2s;
      }
      #portfolio-home:hover { background: #fff; color: #000; }

      #start-screen {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, rgba(8, 14, 25, 0.08), rgba(5, 9, 16, 0.28));
        cursor: pointer;
        transition: opacity 1s ease;
      }
      #start-screen.leaving { opacity: 0; pointer-events: none; }
      #start-screen__content {
        margin-top: 24vh;
        text-align: center;
        color: #f6f8ff;
        text-shadow: 0 2px 24px rgba(3, 8, 16, 0.92);
        user-select: none;
      }
      #start-screen h1 {
        margin: 0 0 18px;
        font: 600 clamp(30px, 5vw, 62px)/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.19em;
        text-transform: uppercase;
      }
      #start-screen p {
        margin: 0;
        font: 600 clamp(12px, 1.4vw, 16px)/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        animation: play-pulse 1.2s ease-in-out infinite alternate;
      }
      @keyframes play-pulse { from { opacity: 0.3; } to { opacity: 1; } }

      #hint {
        position: fixed;
        left: 50%;
        bottom: 34px;
        transform: translateX(-50%);
        font: 500 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 244, 230, 0.72);
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
        pointer-events: none;
        transition: opacity 1.8s ease 6s;
      }
      #hint.fade { opacity: 0; }
      #hint b { color: #ffd9a8; font-weight: 600; }

      #hud {
        position: fixed;
        left: 14px;
        top: 12px;
        padding: 9px 12px;
        border-radius: 7px;
        background: rgba(8, 12, 22, 0.62);
        border: 1px solid rgba(255, 244, 230, 0.12);
        font: 500 12px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color: rgba(255, 244, 230, 0.9);
        white-space: pre;
        pointer-events: none;
        letter-spacing: 0.02em;
      }
      #hud .big { font-size: 17px; font-weight: 700; color: #ffd9a8; }
      #hud.hidden { display: none; }

      #quality {
        position: fixed;
        right: 18px;
        bottom: 14px;
        font: 500 11px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 244, 230, 0.45);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.6s ease;
      }

      /* Desktop command HUD — deliberately separate from the touch-only controls below. */
      #desktop-command-hud {
        position: fixed;
        z-index: 12;
        top: 18px;
        right: 18px;
        display: none;
        width: min(286px, calc(100vw - 36px));
        box-sizing: border-box;
        padding: 15px 15px 14px;
        border: 1px solid rgba(255,255,255,.62);
        background: linear-gradient(145deg, rgba(4,8,15,.80), rgba(7,12,22,.53));
        box-shadow: 0 12px 36px rgba(0,0,0,.30), inset 0 1px rgba(255,255,255,.08);
        color: rgba(255,255,255,.94);
        opacity: 0;
        transform: translateY(-8px);
        transition: opacity .7s ease, transform .7s ease;
        font: 600 10px/1.2 'Space Mono', ui-monospace, monospace;
        letter-spacing: .12em;
        text-transform: uppercase;
      }
      #desktop-command-hud.is-visible { opacity: 1; transform: translateY(0); }
      .command-hud__keys { display: grid; grid-template-columns: repeat(3, 28px); gap: 5px; width: max-content; margin: 0 auto 11px; }
      .command-hud__key {
        display: grid;
        width: 28px;
        height: 25px;
        place-items: center;
        border: 1px solid rgba(255,255,255,.48);
        background: rgba(255,255,255,.05);
        color: #fff;
        font-size: 10px;
        letter-spacing: 0;
      }
      .command-hud__key--up { grid-column: 2; }
      .command-hud__key--boost { grid-column: 1 / -1; width: auto; height: 22px; font-size: 9px; letter-spacing: .1em; }
      .command-hud__movement { margin: 0 0 15px; color: rgba(255,255,255,.56); font-size: 8px; text-align: center; }
      .command-hud__section { padding-top: 12px; border-top: 1px solid rgba(255,255,255,.18); }
      .command-hud__section + .command-hud__section { margin-top: 13px; }
      .command-hud__heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
      .command-hud__heading span:first-child { color: rgba(255,255,255,.62); font-size: 8px; }
      .command-hud__value { color: #fff; font-size: 10px; letter-spacing: .08em; }
      .command-hud__shortcut { color: rgba(255,255,255,.48); font-size: 8px; white-space: nowrap; }
      .command-hud__range { width: 100%; margin: 0; accent-color: #f4f7ff; cursor: pointer; }
      .command-hud__scale { display: flex; justify-content: space-between; gap: 4px; margin-top: 7px; color: rgba(255,255,255,.45); font-size: 7px; letter-spacing: .03em; }
      .command-hud__scale span.is-active { color: #fff; }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0b0f1a;
        color: rgba(255, 244, 230, 0.8);
        font: 500 13px/1.5 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        transition: opacity 0.8s ease;
      }
      #loading.gone { opacity: 0; pointer-events: none; }

      /* Mobile-only game controls. Desktop keeps the existing keyboard HUD and
         quality controls exactly as they are. */
      #mobile-controls, #mobile-boost, #mobile-fps, #mobile-swipe-hint { display: none; }
      @media (max-width: 700px), (hover: none) and (pointer: coarse) {
        #hud, #quality, #hint { display: none !important; }
        #mobile-controls {
          position: fixed;
          z-index: 9;
          top: max(14px, env(safe-area-inset-top));
          right: 14px;
          display: grid;
          gap: 8px;
        }
        .mobile-control, #mobile-boost {
          appearance: none;
          color: #fff;
          font: 600 10px/1.15 'Space Mono', ui-monospace, monospace;
          letter-spacing: .13em;
          text-transform: uppercase;
          text-align: center;
          border: 1px solid rgba(255,255,255,.7);
          background: rgba(0,0,0,.36);
          padding: 10px 11px;
          min-width: 112px;
          cursor: pointer;
          -webkit-tap-highlight-color: transparent;
        }
        .mobile-control:active, #mobile-boost:active { background: #fff; color: #000; }
        .mobile-control__value, #mobile-boost__value {
          display: block;
          margin-top: 5px;
          color: rgba(255,255,255,.65);
          font-size: 9px;
          letter-spacing: .1em;
        }
        #mobile-fps {
          position: fixed;
          z-index: 9;
          top: max(18px, env(safe-area-inset-top));
          left: 50%;
          display: block;
          transform: translateX(-50%);
          color: rgba(255,255,255,.72);
          font: 600 10px/1 'Space Mono', ui-monospace, monospace;
          letter-spacing: .12em;
          pointer-events: none;
        }
        #mobile-boost {
          position: fixed;
          z-index: 9;
          left: 50%;
          bottom: max(30px, env(safe-area-inset-bottom));
          display: block;
          transform: translateX(-50%);
          min-width: 156px;
        }
        #mobile-boost.is-on { background: rgba(255,217,168,.9); color: #080c16; border-color: #ffe4bf; }
        #mobile-boost.is-on #mobile-boost__value { color: rgba(8,12,22,.7); }
        #mobile-swipe-hint {
          position: fixed;
          z-index: 8;
          top: 44%;
          left: 50%;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
          width: min(82vw, 260px);
          transform: translate(-50%, -50%);
          color: rgba(255,255,255,.78);
          font: 700 clamp(11px, 3.2vw, 14px)/1 'Space Mono', ui-monospace, monospace;
          letter-spacing: .1em;
          white-space: nowrap;
          text-transform: uppercase;
          text-shadow: 0 2px 16px rgba(0,0,0,.8);
          opacity: 0;
          pointer-events: none;
          transition: opacity .7s ease;
        }
        #mobile-swipe-hint.is-visible { opacity: 1; }
        #mobile-swipe-hint.is-dismissing { opacity: 0; }
        #mobile-swipe-hint svg {
          width: min(62vw, 210px);
          height: auto;
          overflow: visible;
          filter: drop-shadow(0 2px 10px rgba(0,0,0,.72));
        }
        #mobile-swipe-hint path {
          fill: none;
          stroke: currentColor;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        #mobile-swipe-hint .swipe-arc { stroke-width: 10; opacity: .72; }
        #mobile-swipe-hint .swipe-arrow { stroke-width: 10; opacity: .9; }
        #start-screen:not(.leaving) ~ #mobile-controls,
        #start-screen:not(.leaving) ~ #mobile-boost,
        #start-screen:not(.leaving) ~ #mobile-fps,
        #start-screen:not(.leaving) ~ #mobile-swipe-hint { opacity: 0; pointer-events: none; }
      }
    </style>
    <script>
      // The desktop build deliberately starts at the game's Low preset (index 3).
      // Mobile retains its independent Medium default inside the game bundle.
      (() => {
        const mobile = matchMedia('(max-width: 700px), (hover: none) and (pointer: coarse)').matches;
        const params = new URLSearchParams(location.search);
        if (mobile || params.has('q')) return;
        params.set('q', '3');
        history.replaceState(null, '', `${location.pathname}?${params}${location.hash}`);
        addEventListener('load', () => {
          const clean = new URL(location.href);
          clean.searchParams.delete('q');
          history.replaceState(null, '', `${clean.pathname}${clean.search}${clean.hash}`);
        }, { once: true });
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-zjfuxYMU.js"></script>
  </head>
  <body>
    <a id="portfolio-home" href="/index.html?view=home&build=f818b9b">Home</a>
    <div id="loading">Warming the light&hellip;</div>
    <div id="start-screen" role="button" tabindex="0" aria-label="Start Snowrider">
      <div id="start-screen__content">
        <h1>Snowrider</h1>
        <p>Click to Play</p>
      </div>
    </div>
    <div id="hint">
      <b>W</b> push &nbsp;&middot;&nbsp; <b>A</b> / <b>D</b> carve &nbsp;&middot;&nbsp;
      <b>Shift</b> boost &nbsp;&middot;&nbsp; <b>L</b> light &nbsp;&middot;&nbsp;
      <b>[</b> <b>]</b> quality
    </div>
    <div id="quality"></div>
    <div id="hud">measuring&hellip;</div>
    <aside id="desktop-command-hud" aria-label="Snowrider desktop controls">
      <div class="command-hud__keys" aria-hidden="true">
        <span class="command-hud__key command-hud__key--up">W</span>
        <span class="command-hud__key">A</span>
        <span class="command-hud__key">S</span>
        <span class="command-hud__key">D</span>
        <span class="command-hud__key command-hud__key--boost">Shift · Boost</span>
      </div>
      <p class="command-hud__movement">W Push · A / D Carve</p>
      <section class="command-hud__section" aria-label="Quality setting">
        <div class="command-hud__heading">
          <span>Quality</span><output class="command-hud__value" id="desktop-quality-value">Low</output>
          <span class="command-hud__shortcut">[ ] Change</span>
        </div>
        <input class="command-hud__range" id="desktop-quality" type="range" min="0" max="5" value="2" step="1" aria-label="Quality: Low" />
        <div class="command-hud__scale" id="desktop-quality-scale" aria-hidden="true">
          <span>Int.</span><span>Min.</span><span>Low</span><span>Med.</span><span>High</span><span>Ultra</span>
        </div>
      </section>
      <section class="command-hud__section" aria-label="Day and time setting">
        <div class="command-hud__heading">
          <span>Day / Time</span><output class="command-hud__value" id="desktop-light-value">Golden Hour</output>
          <span class="command-hud__shortcut">L Change</span>
        </div>
        <input class="command-hud__range" id="desktop-light" type="range" min="0" max="1" value="0" step="1" aria-label="Day and time: Golden Hour" />
        <div class="command-hud__scale" id="desktop-light-scale" aria-hidden="true"><span>Golden</span><span>Alpine</span></div>
      </section>
    </aside>
    <div id="mobile-fps" aria-live="polite">-- FPS</div>
    <div id="mobile-controls" aria-label="Game settings">
      <button class="mobile-control" id="mobile-quality" type="button">
        Quality <span class="mobile-control__value" id="mobile-quality-value">Integrated</span>
      </button>
      <button class="mobile-control" id="mobile-background" type="button">
        Background <span class="mobile-control__value" id="mobile-background-value">Pre-sunset</span>
      </button>
    </div>
    <button id="mobile-boost" type="button" aria-pressed="false">
      Tap for boost <span id="mobile-boost__value">Off</span>
    </button>
    <div id="mobile-swipe-hint" aria-hidden="true">
      <svg viewBox="0 0 240 92" role="presentation" focusable="false">
        <path class="swipe-arc" d="M42 58 C76 14, 164 14, 198 58" />
        <path class="swipe-arrow" d="M42 58 L68 58 M42 58 L50 34" />
        <path class="swipe-arrow" d="M198 58 L172 58 M198 58 L190 34" />
      </svg>
      <span>Swipe to turn</span>
    </div>
    <script>
      (() => {
        const mobile = matchMedia('(max-width: 700px), (hover: none) and (pointer: coarse)').matches;
        if (mobile) return;

        const startScreen = document.getElementById('start-screen');
        const commandHud = document.getElementById('desktop-command-hud');
        const qualityRange = document.getElementById('desktop-quality');
        const qualityValue = document.getElementById('desktop-quality-value');
        const qualityScale = document.getElementById('desktop-quality-scale');
        const lightRange = document.getElementById('desktop-light');
        const lightValue = document.getElementById('desktop-light-value');
        const lightScale = document.getElementById('desktop-light-scale');
        const qualityNames = ['Integrated', 'Minimum', 'Low', 'Medium', 'High', 'Ultra'];
        const lightNames = ['Golden Hour', 'Alpine Day'];
        let quality = 2; // The game bundle is forced to its matching Low index (3) above.
        let light = 0;

        const key = (code) => window.dispatchEvent(new KeyboardEvent('keydown', { code, bubbles: true }));
        const paint = () => {
          qualityRange.value = String(quality);
          qualityValue.textContent = qualityNames[quality];
          qualityRange.setAttribute('aria-label', `Quality: ${qualityNames[quality]}`);
          [...qualityScale.children].forEach((node, index) => node.classList.toggle('is-active', index === quality));
          lightRange.value = String(light);
          lightValue.textContent = lightNames[light];
          lightRange.setAttribute('aria-label', `Day and time: ${lightNames[light]}`);
          [...lightScale.children].forEach((node, index) => node.classList.toggle('is-active', index === light));
        };
        const setQuality = (next) => {
          next = Math.max(0, Math.min(qualityNames.length - 1, next));
          while (quality !== next) {
            key(next > quality ? 'BracketRight' : 'BracketLeft');
          }
          paint();
        };
        const setLight = (next) => {
          next = Math.max(0, Math.min(lightNames.length - 1, next));
          while (light !== next) key('KeyL');
          paint();
        };

        qualityRange.addEventListener('input', () => setQuality(Number(qualityRange.value)));
        qualityRange.addEventListener('change', () => setQuality(Number(qualityRange.value)));
        lightRange.addEventListener('input', () => setLight(Number(lightRange.value)));
        lightRange.addEventListener('change', () => setLight(Number(lightRange.value)));
        window.addEventListener('keydown', (event) => {
          if (event.code === 'BracketLeft') quality = Math.max(0, quality - 1);
          if (event.code === 'BracketRight') quality = Math.min(qualityNames.length - 1, quality + 1);
          if (event.code === 'KeyL') light = (light + 1) % lightNames.length;
          paint();
        });
        new MutationObserver(() => {
          if (!startScreen.classList.contains('leaving')) return;
          commandHud.style.display = 'block';
          setTimeout(() => commandHud.classList.add('is-visible'), 3400);
        }).observe(startScreen, { attributes: true, attributeFilter: ['class'] });
        paint();
      })();
    </script>
    <script>
      (() => {
        const mobile = matchMedia('(max-width: 700px), (hover: none) and (pointer: coarse)');
        if (!mobile.matches) return;

        const startScreen = document.getElementById('start-screen');
        const hint = document.getElementById('mobile-swipe-hint');
        if (!startScreen || !hint) return;

        let shown = false;
        let startPoint = null;
        let dismissTimer = 0;

        const dismiss = () => {
          if (!shown || hint.classList.contains('is-dismissing')) return;
          hint.classList.add('is-dismissing');
          clearTimeout(dismissTimer);
          dismissTimer = setTimeout(() => hint.remove(), 750);
        };

        const attachSwipeDismissal = () => {
          const canvas = document.querySelector('canvas');
          if (!canvas) return requestAnimationFrame(attachSwipeDismissal);

          canvas.addEventListener('pointerdown', (event) => {
            startPoint = { id: event.pointerId, x: event.clientX, y: event.clientY };
          }, { passive: true });
          canvas.addEventListener('pointermove', (event) => {
            if (!startPoint || event.pointerId !== startPoint.id) return;
            if (Math.hypot(event.clientX - startPoint.x, event.clientY - startPoint.y) >= 12) dismiss();
          }, { passive: true });
          canvas.addEventListener('pointerup', () => { startPoint = null; }, { passive: true });
          canvas.addEventListener('pointercancel', () => { startPoint = null; }, { passive: true });
        };

        new MutationObserver(() => {
          if (shown || !startScreen.classList.contains('leaving')) return;
          shown = true;
          setTimeout(() => hint.classList.add('is-visible'), 3400);
        }).observe(startScreen, { attributes: true, attributeFilter: ['class'] });

        attachSwipeDismissal();
      })();
    </script>
  </body>
